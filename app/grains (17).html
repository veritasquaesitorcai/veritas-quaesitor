  // Text imprint rendering disabled.
  for(const mark of grainImprints){const fade=Math.exp(-Math.max(0,t-mark.born-1.5)/3.2)*mark.amount;granular(mark.points,480*fade);granular(mark.halo,500*fade);}
  for (let i = 0; i < N; i++) {
    const m = mode[i]; if (m === 0) continue;
    if(m===4)blowActive=true;
    // in words grains are denser and darker (they read as pressed, wetter sand); in the wind they are light and sparse
    const departure=Math.min(1,Math.max(0,life[i])*2);
    const lift=m===4?departure*departure*(3-2*departure):0;
    const isText=m===2||m===3||m===4;
    const cell=isText?Math.max(0,Math.min(surfaceH-1,Math.floor(ty[i]*surfaceY)))*surfaceW+Math.max(0,Math.min(surfaceW-1,Math.floor(tx[i]*surfaceX))):0;
    const localDepth=isText?Math.max(0,touchDepth[cell]-sculptHeight[cell]):0;
    const roughness=isText?Math.min(1,Math.max(0,TERRAIN_LEVELS[terrainLevel]*terrainShuffleBoost-2.2)*.18+Math.abs(sculptHeight[cell])*.50+localDepth*.35):0;
    const readableOpacity=textOpacity[i]*(1.70+roughness*1.40);
    // Keep fine grain detail but choose dark or pale grains for the local substrate.
    const darkFloor=Math.max(0,Math.min(1,(localDepth-.52)/.07));
    const contrastBlend=darkFloor*darkFloor*(3-2*darkFloor);
    const darkGrain=Math.max(0,Math.min(.90,textTone[i]*(.65+shade[i]*.70)*(1-roughness*.85)));
    const paleGrain=.74+shade[i]*.18;
    const textColour=darkGrain+(paleGrain-darkGrain)*contrastBlend;
    const windColour=.17+shade[i]*.50;
    let a=m===1?47:m===4?readableOpacity*(1-lift)+Math.max(0,90-Math.max(0,life[i]-.5)*40)*lift:readableOpacity;
    const k=m===1?windColour:m===4?textColour+(windColour-textColour)*lift:textColour;
    const effectSize=1.05+1.15*seed[i]*seed[i];
    let diameter=m===4?grainSize[i]+(effectSize-grainSize[i])*lift:grainSize[i]*(m===1?.60:1);
    if(m===1){a=Math.min(99,a*effectRoot);diameter*=effectRoot;}
    else if(m===4){const gain=1+(effectRoot-1)*lift;a=Math.min(readableOpacity,a*gain);diameter*=gain;}
    posBuf[n * 4] = px[i]; posBuf[n * 4 + 1] = py[i]; posBuf[n * 4 + 2] = Math.floor(a) + Math.min(0.999, k); posBuf[n * 4 + 3] = diameter+((m===2||m===3||m===4)?16:0); n++;
  }
  gl.useProgram(P); gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, posBuf, 0, n * 4);
  const uS = uniform(P, 'uS'), uO = uniform(P, 'uOff'), uSh = uniform(P, 'uShadow');
  gl.uniform2f(uniform(P, 'uR'), W, H);
  gl.uniform1f(uS, 1.18 * dpr); gl.uniform1f(uO, 0.22); gl.uniform1f(uSh, 1); gl.drawArrays(gl.POINTS, 0, n);
  gl.uniform1f(uS, dpr); gl.uniform1f(uO, 0); gl.uniform1f(uSh, 0); gl.drawArrays(gl.POINTS, 0, n);
  return n;
}

// ---- loop ----
let last = performance.now(), fr = 0, fAcc = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); updateSurface(dt); const n = draw();updateControlStates();
  fr++; fAcc += dt; if (fAcc > 1) { document.getElementById('fps').textContent = `${Math.round(fr / fAcc)} fps · ${(n+bedCount).toLocaleString()} grains`; fr = 0; fAcc = 0; }
  requestAnimationFrame(loop);
}

// ---- the exchange ----
const wait = ms => new Promise(r => setTimeout(r, ms));
let qWord = null, aWord = null;
async function exchange(q, answerFn) {
  if (aWord) blowAway(aWord); if (qWord) blowAway(qWord);
  await wait(180);
  qWord = form(q, H * 0.27, Math.min(46, W / 18));
  windT = 1;                                    // VQ is working: the wind streams across
  let ans;exchangeActive++;try{ans=await answerFn();}finally{exchangeActive--;updateControlStates();}
  windT = liveOn ? 0.40 : 0.15;
  const answer = ans.replace(/\s+/g, ' ').trim();
  document.getElementById('sr').textContent = ans;
  aWord = form(answer, H * 0.6, Math.min(34, W / 24));
  setTimeout(() => { windT = liveOn ? 0.40 : 0; }, 2500);
}
async function demoAnswer() { await wait(3200); return 'Dolphins sleep with one half of their brain at a time.'; }
let liveOn = false,exchangeActive=0;
const controlFlash=new Map();
function flashControl(id,ms=650){controlFlash.set(id,performance.now()+ms);updateControlStates();}
function updateControlStates(){
  const now=performance.now();
  for(const id of ['demo','wind','blow','shuffle','reset-terrain','effects','terrain']){
    const button=document.getElementById(id);let active=(controlFlash.get(id)||0)>now;
    if(id==='demo')active=active||exchangeActive>0;
    if(id==='wind')active=active||windT>.01||windOn>.04;
    if(id==='blow')active=active||blowActive;
    if(id==='effects')active=true;
    if(id==='terrain')active=true;
    if(button.getAttribute('aria-pressed')!==String(active)){button.classList.toggle('is-active',active);button.setAttribute('aria-pressed',String(active));}
  }
  const terrainButton=document.getElementById('terrain'),label='Terrain: '+LEVEL_NAMES[terrainLevel];if(terrainButton.textContent!==label)terrainButton.textContent=label;
}
let blowActive=false;
async function liveAnswer(q) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: q, history: [], stream: false }) });
    const d = await r.json(); return (d.response || d.text || d.reply || 'No answer came back.').replace(/[*#`>]/g, '');
  } catch (e) { return 'The signal dropped, ask again.'; }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const q = document.getElementById('q').value.trim(); if (!q) return; document.getElementById('q').value = ''; exchange(q, liveOn ? () => liveAnswer(q) : demoAnswer); });
document.getElementById('sculpt-level').onclick=e=>{sculptHeavy=!sculptHeavy;e.target.textContent='Sculpt strength: '+(sculptHeavy?'Heavy':'Normal');e.target.setAttribute('aria-label','Sculpt strength: '+(sculptHeavy?'Heavy':'Normal')+'. Click to change.');};
document.getElementById('sculpt').onclick=e=>{sculptOn=!sculptOn;sculptDragging=false;pointerLast=null;lastTouchTap=null;sculptTravel=0;sculptHeading=null;e.target.textContent='Sculpt: '+(sculptOn?'on':'off');e.target.setAttribute('aria-pressed',String(sculptOn));};
document.getElementById('touch-mode').onclick=e=>{touchMode=(touchMode+1)%5;pointerLast=null;footDistance=0;footSide=1;e.target.textContent='Touch: '+TOUCH_NAMES[touchMode];e.target.setAttribute('aria-pressed',String(touchMode!==4));e.target.setAttribute('aria-label','Mouse and touch imprint mode: '+TOUCH_NAMES[touchMode]+'. Click to change.');};
document.getElementById('wind-level').onclick=e=>{windLevel=(windLevel+1)%3;e.target.textContent='Wind level: '+WIND_NAMES[windLevel];e.target.setAttribute('aria-label','Wind strength: '+WIND_NAMES[windLevel]+'. Click to change.');};
document.getElementById('wind-imprints').onclick=e=>{windRemain=!windRemain;e.target.textContent='Wind imprints: '+(windRemain?'Remain':'Fade');e.target.setAttribute('aria-pressed',String(windRemain));};
document.getElementById('imprints').onclick=e=>{pointerRemain=!pointerRemain;e.target.textContent='Imprints: '+(pointerRemain?'Remain':'Fade');e.target.setAttribute('aria-pressed',String(pointerRemain));};
document.getElementById('shuffle').onclick=()=>{flashControl('shuffle',650);terrainOffset=[Math.random()*12000,Math.random()*12000];terrainShuffleBoost=3.4;buildBed();};
document.getElementById('reset-terrain').onclick=()=>{flashControl('reset-terrain',650);terrainOffset=initialTerrainOffset.slice();terrainShuffleBoost=1;terrainLevel=1;
  for(const field of [bedDX,bedDY,bedNextX,bedNextY,touchDX,touchDY,touchNextX,touchNextY,touchDepth,touchNextDepth,sculptHeight,windTerrainHeight,sculptDX,sculptDY,dents,dentsNext,bedPixels])field.fill(0);
  bedMaxDepth=0;sculptBounds=null;sculptSettling=0;sculptTravel=0;sculptHeading=null;grainImprints=[];buildBed();surfaceClock=1/30;updateSurface(0);updateControlStates();};
document.getElementById('effects').onclick=e=>{effectLevel=(effectLevel+1)%3;e.target.textContent='Effects: '+LEVEL_NAMES[effectLevel];e.target.setAttribute('aria-label','Grain effect strength: '+LEVEL_NAMES[effectLevel]+'. Click to change.');};
document.getElementById('terrain').onclick=e=>{terrainLevel=(terrainLevel+1)%3;bedDirty=true;e.target.textContent='Terrain: '+LEVEL_NAMES[terrainLevel];e.target.setAttribute('aria-label','Resting hills and valleys: '+LEVEL_NAMES[terrainLevel]+'. Click to change.');};
document.getElementById('demo').onclick = () => {flashControl('demo',400);return exchange('how do dolphins sleep?', demoAnswer);};
document.getElementById('wind').onclick = () => { windT = windT ? 0 : 1; };
document.getElementById('blow').onclick = () => { flashControl('blow',500);blowAway(); qWord = aWord = null; };
document.getElementById('live').onclick = (e) => { liveOn = !liveOn; windT = liveOn ? 0.40 : 0; e.target.textContent = 'Live: ' + (liveOn ? 'on' : 'off'); e.target.setAttribute('aria-pressed',String(liveOn)); };

for (let i = 0; i < N; i++) { shade[i] = Math.random(); seed[i] = Math.random(); }
addEventListener('resize', resize);
resize(); initGL(); requestAnimationFrame(loop);
windT = 0.12;                                    // a few grains drifting at rest
</script>
</body>
