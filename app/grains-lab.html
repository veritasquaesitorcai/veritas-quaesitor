<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VQ · Grains</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8bf98; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  input { width: 100%; box-sizing: border-box; padding: 0.9rem 1rem; border: 0; outline: 0; background: transparent; text-align: center;
    font: 600 1.2rem "Segoe UI", system-ui, sans-serif; color: #3a2610; caret-color: #3a2610; border-bottom: 1px solid rgba(80,50,20,0.25); }
  input::placeholder { color: rgba(58,38,16,0.55); }
  .tools { position: fixed; left: 12px; bottom: 10px; z-index: 2; display: flex; gap: 6px; }
  .tools button { font: 12px system-ui, sans-serif; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(80,50,20,0.3); background: rgba(255,245,225,0.35); color: #4a3218; cursor: pointer; }
  #live { min-width: 86px; color: #36210e; background: rgba(255,245,225,.78); font-weight: 700; }
  #live[aria-pressed="true"] { color: #fff7e8; background: #49341e; border-color: #49341e; }
  .tools { max-width: calc(100vw - 24px); flex-wrap: wrap; }
  .fps { position: fixed; right: 12px; top: 12px; z-index: 2; font: 11px ui-monospace, monospace; color: rgba(60,40,20,0.6); }
  .panel { position: fixed; right: 12px; top: 34px; z-index: 3; width: 250px; max-height: calc(100vh - 90px); overflow: auto; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,247,232,.88); border: 1px solid rgba(80,50,20,.25); font: 12px system-ui, sans-serif; color: #3a2610; box-shadow: 0 8px 24px rgba(60,40,20,.2); display: none; }
  .panel.on { display: block; }
  .panel h4 { margin: 8px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .panel label { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 2px 6px; margin: 4px 0; }
  .panel input[type=range] { grid-column: 1 / -1; width: 100%; }
  .panel output { text-align: right; font: 11px ui-monospace, monospace; }
  .panel select, .panel .row button { font: 12px system-ui, sans-serif; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(80,50,20,.3); background: #fff8ec; color: #3a2610; }
  .panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .card-img { position: fixed; z-index: 1; border-radius: 4px; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; object-fit: cover; box-shadow: inset 0 0 0 1px rgba(60,40,20,.2); }
  .card-img.on { opacity: .9; }
  body.night { background: #1b2230; }
  body.night input { color: #e6ecf5; caret-color: #e6ecf5; border-bottom-color: rgba(220,230,255,.25); }
  body.night input::placeholder { color: rgba(220,230,250,.55); }
  body.night .fps { color: rgba(220,230,250,.6); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<form id="f" autocomplete="off"><input id="q" maxlength="120" placeholder="ask something, and watch the sand"></form>
<div class="tools"><button id="demo" type="button">Demo</button><button id="wind" type="button">Wind</button><button id="blow" type="button">Blow away</button><button id="live" type="button" aria-pressed="false">Live: off</button><button id="effects" type="button" aria-label="Grain effect strength: medium. Click to change.">Effects: Med</button><button id="terrain" type="button" aria-label="Resting hills and valleys: medium. Click to change.">Terrain: Med</button><button id="shuffle" type="button">Shuffle terrain</button><button id="tune" type="button">⚙ Tune</button></div>
<div class="panel" id="panel" aria-label="Tuning">
  <h4>Test</h4>
  <div class="row"><select id="sample" aria-label="Test text">
    <option value="short">Short reply</option><option value="medium" selected>One sentence</option><option value="long">Long answer (3 sentences)</option>
    <option value="para">Paragraph (stress test)</option><option value="word">Single word</option></select><button id="runSample" type="button">Run</button></div>
  <div class="row"><button id="card" type="button">Card test</button><button id="cards3" type="button">3 cards</button><button id="night" type="button">Night</button><button id="snap" type="button">Save PNG</button></div>
  <h4>Grains</h4>
  <label>Text grain size <output id="o-grain"></output><input type="range" id="grain" min="0.5" max="2" step="0.05"></label>
  <label>Text density <output id="o-density"></output><input type="range" id="density" min="0.4" max="1.6" step="0.05"></label>
  <label>Pour speed <output id="o-pour"></output><input type="range" id="pour" min="0.3" max="3" step="0.05"></label>
  <label>Pour spread <output id="o-spread"></output><input type="range" id="spread" min="0.2" max="3" step="0.05"></label>
  <h4>Wind</h4>
  <label>Wind strength <output id="o-wind"></output><input type="range" id="windS" min="0.2" max="3" step="0.05"></label>
  <label>Wind amount <output id="o-amount"></output><input type="range" id="amount" min="0.1" max="3" step="0.05"></label>
  <label>Gustiness <output id="o-gust"></output><input type="range" id="gust" min="0" max="3" step="0.05"></label>

  <div class="row"><label style="display:flex;gap:6px;margin:0"><input type="checkbox" id="auto" checked> auto-quality on slow devices</label></div>
  <div id="perf" style="font:11px ui-monospace,monospace;opacity:.8;line-height:1.5"></div>
  <div class="row"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
</div>
<div class="fps" id="fps"></div>
<div class="sr" id="sr" aria-live="polite"></div>
<script>
'use strict';
// Grains test: every dot is one grain of sand with its own position and velocity.
// Wind is a flowing noise field; words are shapes the grains are pulled into, where they settle like poured sand.
const API = 'https://veritas-quaesitor-production.up.railway.app/chat';
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { antialias: false, alpha: false });
const phone = Math.min(innerWidth, innerHeight) < 600;
let N = phone ? 120000 : 320000;               // grains
let px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
let tx = new Float32Array(N), ty = new Float32Array(N);   // target (text) position
let mode = new Uint8Array(N);                 // 0 free/hidden, 1 drifting in wind, 2 bound to a word, 3 settled, 4 blowing away
let life = new Float32Array(N), shade = new Float32Array(N), seed = new Float32Array(N);
let textTone = new Float32Array(N);
let textOpacity = new Float32Array(N);            // brightness derived from actual rendered font size
let grainSize = new Float32Array(N).fill(1.05); // CSS-pixel diameter, retained while grains blow away
let posBuf = new Float32Array(N * 4);         // x, y, colour/alpha packed, diameter
const LEVEL_NAMES=['Low','Med','High'];
const EFFECT_LEVELS=[.85,1.60,2.60], TERRAIN_LEVELS=[1.,2.20,4.20];
let effectLevel=1,terrainLevel=1;
let terrainOffset=[Math.random()*5000,Math.random()*5000];
const effectGain=()=>EFFECT_LEVELS[effectLevel];
// ---- tuning: every slider in the ⚙ panel lands here; "Copy settings" hands the exact values to the coder ----
const DEFAULTS={grain:1,density:1,pour:1,spread:1,windS:1,amount:1,gust:1,budget:1};
let CFG=Object.assign({},DEFAULTS);
try{Object.assign(CFG,JSON.parse(localStorage.getItem('vq-grains-cfg')||'{}'));}catch(e){}
let night=0,nightT=0;
let W = 0, H = 0, dpr = 1, t = 0, windOn = 0, windT = 0, gustNow = 1, gustKick = 0, qualityScale = 1;

// Grow only when a text needs more particles; never omit the end of a sentence.
function ensureGrains(required) {
  if (required <= N) return;
  const oldN=N; N=Math.max(required,Math.ceil(N*1.5));
  const grow=(old,Type,length=N)=>{const next=new Type(length);next.set(old);return next;};
  px=grow(px,Float32Array);py=grow(py,Float32Array);vx=grow(vx,Float32Array);vy=grow(vy,Float32Array);
  tx=grow(tx,Float32Array);ty=grow(ty,Float32Array);mode=grow(mode,Uint8Array);
  life=grow(life,Float32Array);shade=grow(shade,Float32Array);seed=grow(seed,Float32Array);grainSize=grow(grainSize,Float32Array);textTone=grow(textTone,Float32Array);textOpacity=grow(textOpacity,Float32Array);
  for(let i=oldN;i<N;i++){shade[i]=Math.random();seed[i]=Math.random();grainSize[i]=1.05;}
  posBuf=new Float32Array(N*4);
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,posBuf.byteLength,gl.DYNAMIC_DRAW);
}

// ---- pliable surface: a coarse continuous height field beneath the individual grains ----
// Depressions diffuse and relax in seconds; grain rendering and text colour remain unchanged.
const SURFACE_STRENGTH = 0.20;
const TEXT_SURFACE_BOOST = 0.00;
let grainImprints = []; // transient, subpixel sand grains left by departing words
const reliefCanvas=document.createElement('canvas'), reliefCtx=reliefCanvas.getContext('2d',{willReadFrequently:true});
let surfaceW=1,surfaceH=1,surfaceX=1,surfaceY=1;
let dents=new Float32Array(1), dentsNext=new Float32Array(1), surfacePixels=new Float32Array(1);
let bedDX=new Float32Array(1),bedDY=new Float32Array(1),bedNextX=new Float32Array(1),bedNextY=new Float32Array(1),bedPixels=new Float32Array(2);
let bedTex=null,bedProgram=null,bedVao=null,bedBuffer=null,bedCount=0;
let surfaceTex=null, surfaceClock=0, windMarks=0;
function resizeSurface(){
  surfaceW=Math.max(2,Math.ceil(W/4)); surfaceH=Math.max(2,Math.ceil(H/4));
  surfaceX=surfaceW/W;surfaceY=surfaceH/H;
  bedDX=new Float32Array(surfaceW*surfaceH);bedDY=new Float32Array(bedDX.length);bedNextX=new Float32Array(bedDX.length);bedNextY=new Float32Array(bedDX.length);bedPixels=new Float32Array(bedDX.length*2);
  dents=new Float32Array(surfaceW*surfaceH);dentsNext=new Float32Array(dents.length);surfacePixels=new Float32Array(dents.length);
  if(surfaceTex){gl.bindTexture(gl.TEXTURE_2D,surfaceTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.R16F,surfaceW,surfaceH,0,gl.RED,gl.FLOAT,surfacePixels);}
  if(bedTex){gl.bindTexture(gl.TEXTURE_2D,bedTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RG16F,surfaceW,surfaceH,0,gl.RG,gl.FLOAT,bedPixels);buildBed();}
  if(typeof words!=='undefined') words.forEach(w=>{w.hollow=null;w.imprint=null;});
}
function dentAt(x,y,radius,strength){
  const cx=x*surfaceX,cy=y*surfaceY,rx=Math.max(1,radius*surfaceX),ry=Math.max(1,radius*surfaceY);
  for(let yy=Math.max(0,Math.floor(cy-ry*2));yy<=Math.min(surfaceH-1,Math.ceil(cy+ry*2));yy++){
    for(let xx=Math.max(0,Math.floor(cx-rx*2));xx<=Math.min(surfaceW-1,Math.ceil(cx+rx*2));xx++){
      const d=((xx-cx)/rx)**2+((yy-cy)/ry)**2;if(d>4)continue;
      const at=yy*surfaceW+xx;dents[at]=Math.min(.85,dents[at]+strength*Math.exp(-d*1.5));
      // Move real grains away from the contact centre. The flow converges at the rim,
      // making a denser irregular pile there instead of painting a shaded hollow.
      const force=strength*48*Math.exp(-d*1.1);
      bedDX[at]=Math.max(-28,Math.min(28,bedDX[at]+(xx-cx)/rx*force));
      bedDY[at]=Math.max(-28,Math.min(28,bedDY[at]+(yy-cy)/ry*force));
    }
  }
}
function dentLine(x0,y0,x1,y1,radius,strength){
  const distance=Math.hypot(x1-x0,y1-y0),steps=Math.min(48,Math.max(1,Math.ceil(distance/Math.max(3,radius))));
  for(let j=0;j<=steps;j++){const f=j/steps;dentAt(x0+(x1-x0)*f,y0+(y1-y0)*f,radius,strength/(1+steps*.12));}
}
function wordRelief(){
  reliefCanvas.width=surfaceW;reliefCanvas.height=surfaceH;
  reliefCtx.drawImage(tc,0,0,surfaceW,surfaceH);
  const pixels=reliefCtx.getImageData(0,0,surfaceW,surfaceH).data, imprint=new Float32Array(surfaceW*surfaceH);
  for(let j=0;j<imprint.length;j++)imprint[j]=pixels[j*4+3]/255;
  reliefCtx.clearRect(0,0,surfaceW,surfaceH);
  reliefCtx.filter='blur(2px)';reliefCtx.drawImage(tc,0,0,surfaceW,surfaceH);reliefCtx.filter='none';
  const blurred=reliefCtx.getImageData(0,0,surfaceW,surfaceH).data,hollow=new Float32Array(imprint.length);
  for(let j=0;j<hollow.length;j++) hollow[j]=(blurred[j*4+3]/255)*(1-imprint[j]);
  return {hollow,imprint};
}
function updateSurface(dt){
  surfaceClock+=dt;if(surfaceClock<1/30)return;
  const elapsed=surfaceClock;surfaceClock=0;
  const decay=Math.exp(-elapsed/3.8),mix=Math.min(.22,elapsed*2.4);
  for(let y=0;y<surfaceH;y++)for(let x=0;x<surfaceW;x++){
    const j=y*surfaceW+x,left=y*surfaceW+Math.max(0,x-1),right=y*surfaceW+Math.min(surfaceW-1,x+1);
    const up=Math.max(0,y-1)*surfaceW+x,down=Math.min(surfaceH-1,y+1)*surfaceW+x;
    const settle=Math.exp(-elapsed/4.8);
    bedNextX[j]=(bedDX[j]*(1-mix)+(bedDX[left]+bedDX[right]+bedDX[up]+bedDX[down])*.25*mix)*settle;
    bedNextY[j]=(bedDY[j]*(1-mix)+(bedDY[left]+bedDY[right]+bedDY[up]+bedDY[down])*.25*mix)*settle;
    dentsNext[j]=(dents[j]*(1-mix)+(dents[left]+dents[right]+dents[up]+dents[down])*.25*mix)*decay;
  }
  const oldX=bedDX,oldY=bedDY;bedDX=bedNextX;bedDY=bedNextY;bedNextX=oldX;bedNextY=oldY;
  for(let j=0;j<bedDX.length;j++){bedPixels[j*2]=bedDX[j];bedPixels[j*2+1]=bedDY[j];}
  if(bedTex){gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bedTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,surfaceW,surfaceH,gl.RG,gl.FLOAT,bedPixels);}
  const old=dents;dents=dentsNext;dentsNext=old;for(let j=0;j<surfacePixels.length;j++)surfacePixels[j]=dents[j]*SURFACE_STRENGTH;
  for(const w of words){
    if(!w.hollow)continue;
    // Scoop grows as grains reach the word, rather than appearing before they arrive.
    let total=0,count=0;
    for(let k=0;k<w.ids.length;k+=97){const i=w.ids[k];if(mode[i]===3)total++;else if(mode[i]===2&&life[i]>0)total+=Math.exp(-Math.hypot(px[i]-tx[i],py[i]-ty[i])/45);count++;}
    const target=count?total/count:0;w.surfaceAmount+=(target-w.surfaceAmount)*Math.min(1,elapsed*3);
    for(let j=0;j<surfacePixels.length;j++)surfacePixels[j]+=w.hollow[j]*w.surfaceAmount*.08*SURFACE_STRENGTH*TEXT_SURFACE_BOOST;
  }
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,surfaceTex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,surfaceW,surfaceH,gl.RED,gl.FLOAT,surfacePixels);
}
let pointerLast=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointerLast={x:e.clientX,y:e.clientY};dentAt(e.clientX,e.clientY,e.pointerType==='touch'?26:19,.14);});
cv.addEventListener('pointermove',e=>{
  const radius=e.pointerType==='touch'?24:17;
  if(pointerLast)dentLine(pointerLast.x,pointerLast.y,e.clientX,e.clientY,radius,.035);
  else dentAt(e.clientX,e.clientY,radius,.065);
  pointerLast={x:e.clientX,y:e.clientY};
});
for(const event of ['pointerup','pointercancel','pointerleave'])cv.addEventListener(event,()=>{pointerLast=null;});

// ---- smooth flow field (cheap curl-ish noise) ----
function noise(x, y, z) { return Math.sin(x * 1.7 + Math.sin(y * 1.3 + z) * 1.9 + z * 0.6) * 0.5 + Math.sin(y * 2.3 - Math.sin(x * 0.8 - z * 1.1) * 1.6 + z * 0.4) * 0.5; }
function flow(x, y) {                           // returns [fx, fy]: mostly rightward wind, gently swirling
  const s = 0.0028, a = noise(x * s, y * s, t * 0.25) * 1.3;
  return [Math.cos(a) * 0.55 + 0.85, Math.sin(a) * 0.55];
}

// ---- words → target points ----
const tc = document.createElement('canvas'), tg = tc.getContext('2d', { willReadFrequently: true });
function textPoints(text, cx, cy, size, maxW) {
  tc.width = W; tc.height = H; tg.clearRect(0, 0, W, H);
  tg.fillStyle = '#000'; tg.textAlign = 'center'; tg.textBaseline = 'middle';
  const words = text.trim().split(/\s+/); let lines=[];
  const maxHeight = cy < H*.4 ? H*.32 : H*.52;
  // Fit complete sentences into their portion of the surface instead of clipping outer lines.
  for (;;) {
    tg.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`;
    lines=[];let line='';
    for(const w of words){const tt=line?line+' '+w:w;if(tg.measureText(tt).width>maxW&&line){lines.push(line);line=w;}else line=tt;}
    lines.push(line);
    if(lines.length*size*1.18<=maxHeight || size<=12) break;
    size=Math.max(12,size-1);
  }
  lines.forEach((l,i)=>tg.fillText(l,cx,cy+(i-(lines.length-1)/2)*size*1.18));
  const d = tg.getImageData(0, 0, W, H).data, pts = [];
  // Finer sampling keeps smaller grains dense enough to form readable strokes.
  const step = (size > 40 ? 0.61 : 0.37) / Math.sqrt(CFG.density*Math.min(1,qualityScale));
  const y0=Math.max(0,cy-lines.length*size*1.18/2-size), y1=Math.min(H,cy+lines.length*size*1.18/2+size);
  const x0=Math.max(0,cx-maxW/2-size), x1=Math.min(W,cx+maxW/2+size);
  for (let y = y0; y < y1; y += step) for (let x = x0; x < x1; x += step) {
    const xi = x + (Math.random() - 0.5) * step, yi = y + (Math.random() - 0.5) * step;
    if (d[((yi | 0) * W + (xi | 0)) * 4 + 3] > 120) pts.push(xi, yi);
  }
  pts.fontSize = size;
  return pts;
}
// Sample any drawing (not just text) into grain targets: used for cards
function shapePoints(drawFn, box, fine){
  tc.width = W; tc.height = H; tg.clearRect(0, 0, W, H); tg.fillStyle = '#000'; tg.strokeStyle = '#000';
  drawFn(tg);
  const d = tg.getImageData(0, 0, W, H).data, pts = [], step = fine / Math.sqrt(CFG.density*Math.min(1,qualityScale));
  for (let y = Math.max(0,box.y-4); y < Math.min(H,box.y+box.h+4); y += step) for (let x = Math.max(0,box.x-4); x < Math.min(W,box.x+box.w+4); x += step) {
    const xi = x + (Math.random() - 0.5) * step, yi = y + (Math.random() - 0.5) * step;
    if (d[((yi | 0) * W + (xi | 0)) * 4 + 3] > 120) pts.push(xi, yi);
  }
  pts.fontSize = 30; return pts;
}
let words = [];                                 // { ids:[...], born }
function form(text, cy, size, from, shape) {
  const pts = shape ? shapePoints(shape.draw, shape.box, shape.fine || 0.5) : textPoints(text, W / 2, cy, size, Math.min(W - 60, 1000));
  // Continuous bounded scale: fine small letters are dark, broad large letters are light.
  // Use the fitted font size, not the requested size, for long wrapped text.
  const baseTone = 0.02 + 0.62 / (1 + Math.exp(-(pts.fontSize - 42) / 6));
  const largeMix = Math.max(0, Math.min(1, (pts.fontSize-34)/12));
  const brightnessScale = largeMix*largeMix*(3-2*largeMix);
  const tone = baseTone * (0.22 + 0.78*brightnessScale);
  const ids = []; let need = pts.length / 2;
  let available=0;
  for(let i=0;i<N;i++) if(mode[i]===0||mode[i]===1) available++;
  ensureGrains(N+Math.max(0,need-available));
  // Borrow wind/free grains without taking grains away from existing words.
  for (let i = 0; i < N && need > 0; i++) if (mode[i] === 1 || mode[i] === 0) { ids.push(i); need--; }
  ids.forEach((i, k) => {
    tx[i] = pts[k * 2]; ty[i] = pts[k * 2 + 1];
    textTone[i] = shape && shape.tone != null ? shape.tone : tone * .36;
    // Compensate finer subpixel grains with overlapping darker particles; no effect on wind.
    textOpacity[i] = shape ? 99 : pts.fontSize > 40 ? 210 : 305;
    grainSize[i] = (shape && shape.size ? shape.size : (size > 40 ? 0.72 : 0.45)) * CFG.grain * (0.88 + seed[i] * 0.24);
    if (mode[i] === 0) {                        // a grain that wasn't visible blows in from the upwind edge
      if (from === 'below') { px[i] = tx[i] + (Math.random() - 0.5) * 60; py[i] = H + 20 + Math.random() * 200; }
      else { const angle=Math.random()*Math.PI*2,radius=(14+Math.random()*48)*CFG.spread; px[i]=tx[i]+Math.cos(angle)*radius; py[i]=ty[i]+Math.sin(angle)*radius; }
      vx[i] = vy[i] = 0;
    }
    mode[i] = 2; life[i] = -Math.random() * 0.6 - (tx[i] / W) * 0.5; // stagger: left letters first, like pouring
  });
  const w = { ids, text, micro:null, interior:null, hollow:null,imprint:null,surfaceAmount:0, born:t }; words.push(w); return w;
}
function blowAway(w) {
  (w ? [w] : words).forEach(x => { if (x.img) { const im = x.img; im.classList.remove('on'); setTimeout(() => im.remove(), 900); } });
  (w ? [w] : words).forEach(x => x.ids.forEach(i => { if (mode[i] === 2 || mode[i] === 3) { mode[i] = 4; vx[i] = 0.5 + Math.random(); vy[i] = -(Math.random() * 0.8); life[i] = -(px[i] / W) * 0.6 - Math.random() * 0.3; } }));
  words = w ? words.filter(x => x !== w) : [];
}

// ---- simulation ----
function spawnWind(k) {                          // grains enter on the left and stream across
  for (let i = 0, n = 0; i < N && n < k; i++) if (mode[i] === 0) {
    mode[i] = 1; grainSize[i] = 1.05 + 1.15 * seed[i] * seed[i]; px[i] = -10 - Math.random() * 40; py[i] = Math.random() * H; vx[i] = 1 + Math.random(); vy[i] = 0; life[i] = 0; n++;
  }

function posterCanvas(i){const c=document.createElement('canvas');c.width=240;c.height=340;const g=c.getContext('2d');
  const hues=[[30,60,110],[120,40,40],[20,90,80]][i%3];const gr=g.createLinearGradient(0,0,0,340);gr.addColorStop(0,`rgb(${hues})`);gr.addColorStop(1,'#111');g.fillStyle=gr;g.fillRect(0,0,240,340);
  g.fillStyle='rgba(255,230,180,.85)';g.beginPath();g.arc(120,140+i*10,46,0,7);g.fill();g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,250,240,90);return c.toDataURL();}
function sandCard(x,y,w,h,title,i,delay){
  setTimeout(()=>{
    const pad=17, imgH=h-44;
    // shadow cast by the raised slab (down and to the right, away from the sun)
    form(title+'-shadow',0,30,null,{box:{x:x+2,y:y+2,w:w+8,h:h+9},fine:1.0,tone:0.06,size:1.0,draw:(g)=>{
      g.fillRect(x+5,y+6,w,h);g.globalCompositeOperation='destination-out';g.fillRect(x,y,w,h);g.globalCompositeOperation='source-over';}});
    const shape={box:{x,y,w,h},fine:0.85,tone:0.97,size:1.05,draw:(g)=>{
      g.beginPath();g.roundRect?g.roundRect(x,y,w,h,8):g.rect(x,y,w,h);g.fill();       // the whole slab, raised sand
      g.globalCompositeOperation='destination-out';g.font='700 15px "Segoe UI", system-ui, sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText(title,x+w/2,y+imgH+pad+(h-imgH-pad)/2-2);g.globalCompositeOperation='source-over';}};
    const wd=form(title,0,30,null,shape);
    // the title, pressed into the slab's sand strip in dark grains
    const ty2=y+imgH+pad+(h-imgH-pad)/2-2;
    form(title+'-t',0,30,null,{box:{x,y:ty2-12,w,h:24},fine:0.4,tone:0.02,size:0.6,draw:(g)=>{g.font='700 15px "Segoe UI", system-ui, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(title,x+w/2,ty2);}});
    const im=document.createElement('img');im.className='card-img';im.src=posterCanvas(i);im.alt=title;
    Object.assign(im.style,{left:(x+pad)+'px',top:(y+pad)+'px',width:(w-pad*2)+'px',height:(imgH-pad)+'px'});document.body.appendChild(im);wd.img=im;
    setTimeout(()=>im.classList.add('on'),1600);
  },delay||0);
}
function cardRow(n){blowAway();qWord=aWord=null;const w=Math.min(190,(W-80)/n-20),h=Math.round(w*1.5)+44,total=n*w+(n-1)*24,x0=(W-total)/2,y=Math.max(110,H*0.32-h/4);
  ['Desert Light','The Long Quiet','Second Sun'].slice(0,n).forEach((t2,i)=>sandCard(x0+i*(w+24),y,w,h,t2,i,i*350));}
document.getElementById('card').onclick=()=>cardRow(1);
document.getElementById('cards3').onclick=()=>cardRow(3);
document.getElementById('night').onclick=e=>{nightT=nightT?0:1;document.body.classList.toggle('night',!!nightT);e.target.textContent=nightT?'Day':'Night';};
document.getElementById('snap').onclick=()=>{draw();const a=document.createElement('a');a.download='vq-sand-'+Date.now()+'.png';a.href=cv.toDataURL('image/png');a.click();};
document.getElementById('tune').onclick=()=>document.getElementById('panel').classList.toggle('on');
const FMT=v=>(+v).toFixed(2)+'×';
function bindSliders(){Object.keys(DEFAULTS).forEach(k=>{const el=document.getElementById(k),o=document.getElementById('o-'+(k==='windS'?'wind':k));if(!el)return;el.value=CFG[k];o.textContent=FMT(CFG[k]);
  el.oninput=()=>{CFG[k]=+el.value;o.textContent=FMT(CFG[k]);if(k==='budget')qualityScale=Math.min(1,CFG.budget);try{localStorage.setItem('vq-grains-cfg',JSON.stringify(CFG));}catch(e){}};});}
bindSliders();
document.getElementById('copy').onclick=async e=>{const txt=JSON.stringify(Object.assign({},CFG,{effects:LEVEL_NAMES[effectLevel],terrain:LEVEL_NAMES[terrainLevel],night:!!nightT}));
  try{await navigator.clipboard.writeText(txt);e.target.textContent='Copied';}catch(err){prompt('Copy these settings:',txt);}setTimeout(()=>e.target.textContent='Copy settings',1500);};
document.getElementById('reset').onclick=()=>{CFG=Object.assign({},DEFAULTS);qualityScale=1;try{localStorage.removeItem('vq-grains-cfg');}catch(e){}bindSliders();};
document.getElementById('shuffle').onclick=()=>{terrainOffset=[Math.random()*12000,Math.random()*12000];};
document.getElementById('effects').onclick=e=>{effectLevel=(effectLevel+1)%3;e.target.textContent='Effects: '+LEVEL_NAMES[effectLevel];e.target.setAttribute('aria-label','Grain effect strength: '+LEVEL_NAMES[effectLevel]+'. Click to change.');};
document.getElementById('terrain').onclick=e=>{terrainLevel=(terrainLevel+1)%3;e.target.textContent='Terrain: '+LEVEL_NAMES[terrainLevel];e.target.setAttribute('aria-label','Resting hills and valleys: '+LEVEL_NAMES[terrainLevel]+'. Click to change.');};
document.getElementById('demo').onclick = () => exchange('how do dolphins sleep?', demoAnswer);
document.getElementById('wind').onclick = () => { windT = windT ? 0 : 1; };
document.getElementById('blow').onclick = () => { blowAway(); qWord = aWord = null; };
document.getElementById('live').onclick = (e) => { liveOn = !liveOn; windT = liveOn ? 0.40 : 0; e.target.textContent = 'Live: ' + (liveOn ? 'on' : 'off'); e.target.setAttribute('aria-pressed',String(liveOn)); };

for (let i = 0; i < N; i++) { shade[i] = Math.random(); seed[i] = Math.random(); }
addEventListener('resize', resize);
resize(); initGL(); requestAnimationFrame(loop);
windT = 0.12;                                    // a few grains drifting at rest
</script>
</body>
