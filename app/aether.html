<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VQ Aether</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#080d13;color:#dce6ed}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080d13}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 30px 14px;pointer-events:none;z-index:4}
.brand{font-size:12px;letter-spacing:.36em;font-weight:600;color:#dce6ed}
.subtitle{font-size:10px;color:#8294a5;letter-spacing:.12em;margin-top:9px}
.right{text-align:right;pointer-events:auto}
#status{font-size:11px;letter-spacing:.06em;color:#99adbc;max-width:min(520px,70vw);margin-left:auto}
#status i{display:inline-block;background:#a8e1ef;width:5px;height:5px;border-radius:50%;margin-right:8px;box-shadow:0 0 12px #85d7ee;vertical-align:middle}
#account{margin-top:8px;font:10px inherit;letter-spacing:.08em;color:#7f97a8;background:none;border:0;padding:4px 0;cursor:pointer}
#account:hover{color:#cfe6f0}
#overlay{position:fixed;inset:0;z-index:2;pointer-events:none}
#overlay img{position:absolute;object-fit:cover;border-radius:6px;opacity:0;transition:opacity .9s ease;pointer-events:none}
#overlay img.on{opacity:.92}
#overlay img.pic{pointer-events:auto;cursor:zoom-in}
#overlay .card-sel{position:absolute;z-index:1;pointer-events:auto;background:transparent;border:0;padding:0;border-radius:10px;cursor:pointer;outline:none;transition:box-shadow .3s ease}
#overlay .card-sel:hover,#overlay .card-sel:focus-visible{box-shadow:0 0 0 1px #9fdcf255,0 0 18px #6fc6e833}
#overlay img.pic,#overlay .video{z-index:2}
#overlay .card-link{position:absolute;z-index:3;pointer-events:auto;border-radius:8px;cursor:pointer;outline:none;transition:box-shadow .3s ease,background .3s ease}
#overlay .card-link:hover,#overlay .card-link:focus-visible{background:#8fd3f01a}
#overlay .card-link:hover,#overlay .card-link:focus-visible{box-shadow:0 0 0 1px #9fdcf2aa,0 0 22px #6fc6e855}
.depart-card{position:fixed;z-index:60;pointer-events:none;border:1px solid #cdeffb;border-radius:10px;box-shadow:0 0 30px #8fd8f4cc,inset 0 0 24px #8fd8f455}
.depart-dot{position:fixed;z-index:61;pointer-events:none;width:14px;height:6px;border-radius:6px;background:#f2fcff;box-shadow:0 0 14px 6px #9fe2fa,0 0 40px 12px #5fb8e066}
#player img{max-width:94vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 80px #000a;cursor:zoom-out}
#overlay .video{position:absolute;padding:0;border:0;background:#0b1620;border-radius:8px;overflow:hidden;opacity:0;transition:opacity .9s ease;pointer-events:auto;cursor:pointer}
#overlay .video.on{opacity:1}
#overlay .video img{position:static;width:100%;height:100%;opacity:.9;border-radius:0}
#overlay .video span{position:absolute;left:12px;bottom:10px;font:11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.08em;color:#e6f4fb;background:#06111acc;border:1px solid #b9e2f233;border-radius:14px;padding:7px 11px}
#overlay .video:hover{outline:1px solid #a8dcef77;outline-offset:3px}
#overlay .video:hover img{opacity:1}
#player{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#03080dcc;backdrop-filter:blur(6px)}
#player[hidden]{display:none}
#player iframe{width:min(92vw,calc(80vh*16/9));aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#sources{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 66px);width:min(680px,calc(100% - 40px));z-index:3;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:10px;letter-spacing:.04em;opacity:0;transition:opacity .8s}
#sources.on{opacity:1}
#sources a{color:#7fa6ba;text-decoration:none}
#sources a:hover{color:#d6eef7;text-decoration:underline}
#editor{position:fixed;z-index:3;border:0;resize:none;background:transparent;color:#dfe9f2;padding:0;outline:0;line-height:1.6;font-family:inherit;visibility:hidden;caret-color:#a9deef;overflow:auto;scrollbar-width:none}
#editor::-webkit-scrollbar{display:none}
footer{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;width:min(680px,calc(100% - 40px));transform:translateX(-50%);z-index:5}
form{position:relative;display:flex;gap:10px;border:1px solid #b9d8ed33;background:#0e1924a6;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:30px;padding:6px 7px 6px 23px;box-shadow:0 8px 40px #0003,inset 0 1px #fff1}
input{width:100%;min-width:0;background:none;border:0;color:#e8f3fb;outline:none;font:14px inherit;position:relative;z-index:1}
#ghost{position:absolute;left:23px;right:60px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:300;color:rgba(142,164,180,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .45s}
#ghost.off{opacity:0}
#ghost.wr{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:ghostwrite 1.1s cubic-bezier(.3,0,.2,1) both}
@keyframes ghostwrite{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
#send{flex:none;border:1px solid #b8d6e22b;border-radius:50%;width:42px;height:42px;background:#bfd9e414;color:#d9edf7;font:22px system-ui;cursor:pointer}
#send:hover{background:#c5e4ee30}
#auth{position:fixed;top:70px;right:24px;z-index:6;width:min(300px,calc(100% - 48px));background:#0e1924ee;border:1px solid #b9d8ed33;border-radius:14px;padding:16px;font-size:12px;color:#b9cdd9;backdrop-filter:blur(14px)}
#auth[hidden]{display:none}
#auth button{margin-top:10px;margin-right:8px;font:12px inherit;color:#dcecf4;background:#bfd9e414;border:1px solid #b8d6e22b;border-radius:16px;padding:7px 12px;cursor:pointer}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#error{position:fixed;inset:20% 10%;z-index:10;color:#dfeafa;white-space:pre-wrap;font:16px/1.6 system-ui;display:none}
@media(max-width:600px){header{padding:18px 18px 10px}.brand{font-size:11px}.subtitle{font-size:9px;max-width:190px;line-height:1.5}footer{bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 24px)}form{padding-left:18px}#ghost{left:18px}input,#ghost{font-size:13px}#sources{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 62px)}}

#tool-inputs input{position:fixed;z-index:3;box-sizing:border-box;padding:0 11px;border:0;background:transparent;color:transparent;caret-color:#a9deef;font:500 16px "Segoe UI",system-ui,sans-serif;letter-spacing:normal;outline:0;border-radius:6px;}
#tool-inputs input:focus-visible{outline:1px solid #a9deef;outline-offset:1px;}
#tool-inputs input[type=checkbox]{appearance:none;cursor:pointer;}
#tool-inputs input[type=number]{appearance:textfield;-moz-appearance:textfield;}
#tool-inputs input::-webkit-inner-spin-button,#tool-inputs input::-webkit-outer-spin-button{appearance:none;margin:0;}
/* Orbit: the input rests on Earth's bright limb, so it gets a solid, darker glass for readability */
body.surface-orbit form{background:#06101bde;border-color:#bfe0f250;box-shadow:0 6px 30px #000b,inset 0 1px #fff2}
body.surface-orbit input{color:#ffffff}body.surface-orbit #ghost{color:rgba(174,197,211,.6)}body.surface-orbit #sources a{color:#a8c8d8;text-shadow:0 1px 6px #000}
#ghost{z-index:2}.ghost-take{pointer-events:auto;cursor:pointer}
@media (pointer:coarse){.ghost-take{color:rgba(170,195,210,.7);text-decoration:underline dotted rgba(143,179,200,.6);text-underline-offset:4px}}
#story-cue{position:fixed;z-index:4;display:flex;opacity:0;pointer-events:none;border-radius:16px}
#story-cue.on{opacity:1;pointer-events:auto}#story-cue button{border:0;background:none;color:transparent;padding:0;height:100%;border-radius:15px;cursor:pointer}
#story-cue button:hover:not(:disabled){background:#9fd3ea14}#story-cue button:disabled{cursor:default}
#page-cue{position:fixed;z-index:4;display:flex;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .6s}
#page-cue.on{opacity:1;pointer-events:auto;animation:cueGlow 2.8s ease-in-out .3s infinite}
#page-cue button{border:0;padding:0;height:100%;background:none;color:transparent;cursor:pointer;border-radius:14px}#page-cue button:hover{background:#9fd3ea14}#page-cue button[data-k=lab]{cursor:default}
@keyframes cueGlow{0%,100%{box-shadow:0 0 0 0 #8fd3f000}50%{box-shadow:0 0 16px 2px #8fd3f048}}
@media (prefers-reduced-motion:reduce){#page-cue.on{animation:none}}
#model-inputs{position:fixed;inset:0;pointer-events:none;z-index:14}#model-inputs button{position:absolute;pointer-events:auto;touch-action:none;background:transparent;border:0;padding:0;color:transparent;cursor:grab;user-select:none}#model-inputs button:active{cursor:grabbing}#model-inputs button:focus-visible{outline:1px solid #9ad9ef;border-radius:50%;box-shadow:0 0 8px #8ed9ff66}
/* VQ's workbench: always-on work, drawn in light on the clear right side */
#wb-stage{position:fixed;inset:0;z-index:3;pointer-events:none;perspective:1100px;perspective-origin:calc(100% - 180px) 42%}
#wb.on{pointer-events:auto}
#wb{position:fixed;right:44px;top:max(150px,19vh);width:272px;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.2s ease,transform .9s cubic-bezier(.3,.1,.2,1);font-family:"Segoe UI",Inter,system-ui,sans-serif;transform-origin:50% 40%;transform:translate3d(var(--wbx,0px),var(--wby,0px),0) translateZ(calc(var(--wbz,-260px) + var(--wbb,0px))) rotateY(var(--wbry,0deg)) rotateX(var(--wbrx,0deg)) scale(var(--wbs,1.34));transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 0 16px rgba(110,190,235,.10))}
#wb .wb-title{color:#cfe4f0}
#wb.on{opacity:1}#wb.dim{opacity:.5}#wb.low{opacity:.28}
#wb .wb-now{display:grid;grid-template-columns:16px auto 1fr;align-items:center;column-gap:9px;margin:0 0 12px;min-height:30px;pointer-events:none}
#wb .wb-orb{position:relative;width:12px;height:12px;border-radius:50%;border:1px solid rgba(175,230,250,.45);box-shadow:0 0 10px rgba(110,200,240,.35)}
#wb .wb-orb::after{content:"";position:absolute;left:50%;top:-2.5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#e9fbff;box-shadow:0 0 8px #bff0ff,0 0 16px #6fc6e8;transform-origin:2px 8.5px;animation:wborb 5s linear infinite}
#wb .wb-now.busy .wb-orb{border-color:rgba(200,240,255,.75)}#wb .wb-now.busy .wb-orb::after{animation-duration:1.1s}
@keyframes wborb{to{transform:rotate(360deg)}}
#wb .wb-verb{font-size:8.5px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#c4ecfb;text-shadow:0 0 10px rgba(130,210,245,.6)}
#wb .wb-subj{font-size:11.5px;color:#d9eef7;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#wb .wb-fil{grid-column:2/4;position:relative;height:1px;margin-top:6px;background:rgba(160,220,245,.12);overflow:hidden}
#wb .wb-fil i{position:absolute;top:0;bottom:0;width:30%;left:-30%;background:linear-gradient(90deg,#cff3ff00,#cff3ffdd,#cff3ff00)}
#wb .wb-now.busy .wb-fil i{animation:wbscan 1.3s cubic-bezier(.45,0,.35,1) infinite}
@keyframes wbscan{to{left:100%}}
#wb .wb-head{display:flex;align-items:center;gap:10px;margin:0 0 14px 0;pointer-events:auto;cursor:pointer}
#wb .wb-head:hover b{opacity:1;color:#bfe9f7}
#wb .wb-now,#wb .wb-head,#wb .wb-pulse,#wb .wb-item{transform-origin:100% 50%;transform:perspective(560px) rotateY(-30deg)}
#wb .wb-head canvas{position:static;width:150px;height:22px;flex:none;touch-action:auto}
#wb .wb-head b{font-weight:500;font-size:8.5px;letter-spacing:.32em;color:#7fb3c6;opacity:.7;white-space:nowrap}
#wb .wb-head span{white-space:nowrap;font-size:9px;letter-spacing:.14em;color:#6f93a4;opacity:.75;font-variant-numeric:tabular-nums;margin-left:auto}
#wb .wb-pulse{margin:-6px 0 14px 0;min-height:13px;font-size:10px;letter-spacing:.1em;color:#9cc6d6;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wb .wb-pulse.new{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:wbwrite 1.6s cubic-bezier(.3,0,.2,1) both}
#wb .wb-list{position:relative;padding-left:24px}
#wb .wb-list::before{display:none}
#wb .wb-spark{position:absolute;left:3px;width:5px;height:22px;border-radius:3px;background:linear-gradient(#cff3ff00,#cff3ffcc,#cff3ff00);filter:blur(.6px);opacity:0;top:0}
#wb .wb-spark.go{animation:wbspark 2.4s cubic-bezier(.45,0,.3,1)}
@keyframes wbspark{0%{opacity:0;transform:translateY(-10px)}12%{opacity:.9}88%{opacity:.5}100%{opacity:0;transform:translateY(var(--h,220px))}}
#wb .wb-now,#wb .wb-head,#wb .wb-pulse{transition:transform .9s cubic-bezier(.3,.1,.2,1)}
#wb .wb-item{position:relative;display:block;width:100%;text-align:left;margin:0 0 9px;padding:9px 12px 10px 14px;border-radius:8px;background:linear-gradient(270deg,rgba(150,215,245,.085),rgba(150,215,245,.035) 65%,rgba(150,215,245,.015));border:1px solid rgba(170,225,250,.09);border-right-color:rgba(205,242,255,.26);-webkit-backdrop-filter:blur(5px) saturate(120%);backdrop-filter:blur(5px) saturate(120%);box-shadow:inset -1px 0 0 rgba(225,248,255,.10),0 10px 30px rgba(0,0,0,.22);color:inherit;font:inherit;cursor:pointer;pointer-events:auto;opacity:var(--o,.55);transition:opacity .5s ease,transform .9s cubic-bezier(.3,.1,.2,1),background .6s ease}
#wb .wb-item:hover,#wb .wb-item:focus-visible{opacity:1;outline:none}
#wb .wb-item .wb-seg{position:absolute;left:-17px;top:-10px;bottom:-10px;width:1px;background:linear-gradient(#9fdcf200,#9fdcf240 25%,#9fdcf240 75%,#9fdcf200);pointer-events:none}
#wb .wb-item::before{content:"";position:absolute;left:-20px;top:13px;width:6px;height:6px;border-radius:50%;border:1px solid #a9e3f5;background:#0b1620;box-shadow:0 0 8px #7fd2ee66;transition:background .4s,box-shadow .4s}
#wb .wb-item.ready::before{background:#bff0ff;box-shadow:0 0 10px #8fdcf6,0 0 22px #5fbfe466}
#wb .wb-item.working::before{animation:wbnode 2.8s ease-in-out infinite}
@keyframes wbnode{50%{box-shadow:0 0 14px #9fe4fa,0 0 26px #5fbfe455;background:#2a5468}}
#wb .wb-item::after{content:"";position:absolute;left:-13px;top:16px;height:1px;width:0;background:linear-gradient(90deg,#bff0ffaa,#bff0ff00);transition:width .5s ease}
#wb .wb-item:hover::after{width:12px}
#wb .wb-label{display:block;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:#8fc9dc;opacity:.85}
#wb .wb-title{display:block;margin-top:5px;font-size:12.5px;line-height:1.45;color:#d6e8f1;font-weight:350;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 0 14px #6fc6e822}
#wb .wb-meta{display:block;margin-top:5px;font-size:9.5px;letter-spacing:.08em;color:#7e9cab;max-height:0;opacity:0;overflow:hidden;transition:opacity .4s ease,max-height .4s ease}
#wb .wb-item:hover .wb-meta,#wb .wb-item:focus-visible .wb-meta{opacity:.9;max-height:20px}
#wb .wb-bar{display:block;position:relative;height:1px;margin-top:8px;background:#9fdcf21f;overflow:hidden}
#wb .wb-bar i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:linear-gradient(90deg,#9fdcf244,#cff3ffcc);box-shadow:0 0 6px #9fe4fa;transition:width 1.6s ease}
#wb .wb-bar i::after{content:"";position:absolute;right:0;top:-1px;width:3px;height:3px;border-radius:50%;background:#e8fbff;box-shadow:0 0 6px #bff0ff}
/* written in light: a soft edge sweeps across, then the glow settles */
#wb .wb-item.new .wb-label,#wb .wb-item.new .wb-title{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:wbwrite 1.9s cubic-bezier(.3,0,.2,1) both}
#wb .wb-item.new .wb-title{animation-delay:.25s}
#wb .wb-item.new{animation:wbglow 2.6s ease both}
@keyframes wbwrite{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes wbglow{0%{text-shadow:0 0 0 #0000;opacity:0}20%{opacity:1}60%{opacity:1}100%{opacity:var(--o,.55)}}
#wb.focus{--wbz:-70px;--wbs:1.06}#wb.focus .wb-now,#wb.focus .wb-head,#wb.focus .wb-pulse,#wb.focus .wb-item{transform:perspective(560px) rotateY(-5deg)}
#wb.focus .wb-item{opacity:min(1,calc(var(--o,.6) + .2));background:linear-gradient(270deg,rgba(150,215,245,.16),rgba(150,215,245,.09) 65%,rgba(150,215,245,.06));border-color:rgba(180,230,252,.2)}
#wb.focus .wb-title{color:#eef8fd}
#wb.away{opacity:0!important;--wbz:-1100px;--wbs:.9}
#wb .wb-item.leave{opacity:0!important;transform:perspective(560px) rotateY(-30deg) translateY(-6px)}
/* phones and narrow screens: one quiet line under the status */
@media (max-width:1099px){#wb-stage{perspective:none}#wb{transform:none;filter:none;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 62px);width:min(560px,calc(100% - 48px))}
 #wb .wb-head,#wb .wb-pulse,#wb .wb-now{display:none}#wb .wb-item{transform:none}#wb .wb-list{padding-left:16px}#wb .wb-list::before{display:none}#wb .wb-spark{display:none}
 #wb .wb-item{display:none;padding:2px 0;margin:0}#wb .wb-item:first-of-type{display:block}#wb .wb-item::before{left:-15px;top:7px;width:5px;height:5px}#wb .wb-item::after{display:none}
 #wb .wb-item{text-shadow:0 1px 6px #000,0 0 14px #000c}#wb .wb-label{display:inline;margin-right:10px;font-size:8px}#wb .wb-title{display:inline;font-size:11.5px;-webkit-line-clamp:1}#wb .wb-bar,#wb .wb-meta{display:none}}
</style>
</head>
<body>
<canvas id="surface" aria-hidden="true"></canvas>
<header>
  <div><div class="brand" id="brand">VQ AETHER</div><div class="subtitle">EVERY PIXEL TRAVELS · THE LIGHT WRITES THE ANSWER</div></div>
  <div class="right"><div id="status"><i></i><span id="phase">VQ, ready</span></div><button id="account" type="button">Sign in</button></div>
</header>
<div id="overlay"></div>
<textarea id="editor" spellcheck="false" aria-label="Editable document"></textarea>
<nav id="sources" aria-label="Sources"></nav>
<footer>
  <form id="command" autocomplete="off">
    <input id="input" aria-label="Ask VQ" autocomplete="off">
    <span id="ghost" aria-hidden="true"></span>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
</footer>
<div id="auth" hidden><div id="auth-text">Sign in with Google to use your VQ account.</div><button id="auth-go" type="button">Continue with Google</button><button id="auth-out" type="button" hidden>Sign out</button></div>
<div id="player" hidden></div>
