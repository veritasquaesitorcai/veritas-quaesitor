<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VQ · Sand</title>
<style>
  :root { --ink: #3b2a18; --ink-soft: rgba(59,42,24,0.62); --glass: rgba(255,248,236,0.16); --glass-line: rgba(255,255,255,0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9a57a; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); }
  canvas#sand { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* glass input bar: rises out of the sand */
  .bar { position: fixed; left: 50%; top: 9vh; width: min(46rem, calc(100vw - 32px)); transform: translateX(-50%); z-index: 5;
    border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -10px 24px rgba(255,255,255,0.08), 0 14px 30px rgba(90,60,25,0.28), 0 2px 0 rgba(255,255,255,0.25);
    -webkit-backdrop-filter: blur(3px) saturate(1.2) brightness(1.06); backdrop-filter: blur(3px) saturate(1.2) brightness(1.06);
    transition: opacity .6s, transform .6s cubic-bezier(.2,.9,.2,1); }
  .bar.sunk { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.98); pointer-events: none; }
  .bar input { width: 100%; padding: 1.05rem 1.3rem; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1.15rem; text-align: center; color: #3e2a16;
    text-shadow: 0 1px 0 rgba(255,236,205,0.55); caret-color: #3e2a16; }
  .bar input::placeholder { color: rgba(62,42,22,0.62); }
  /* cards that rise: real content (posters) laid over a raised sand slab */
  .card { position: fixed; z-index: 3; border-radius: 12px; overflow: hidden; cursor: pointer; color: var(--ink);
    transform: translateY(14px) scale(0.96); opacity: 0; filter: blur(4px) sepia(0.6);
    transition: transform .9s cubic-bezier(.2,.9,.2,1), opacity .9s, filter 1.1s; }
  .card.up { transform: none; opacity: 1; filter: none; }
  .card img { display: block; width: 100%; height: calc(100% - 3.1rem); object-fit: cover; mix-blend-mode: multiply; opacity: 0.92; }
  .card .t { position: absolute; left: 0; right: 0; bottom: 0; height: 3.1rem; padding: 0.4rem 0.6rem; font-size: 0.8rem; font-weight: 600; line-height: 1.2;
    color: #4a3420; text-shadow: 0 1px 0 rgba(255,240,215,0.6); overflow: hidden; }
  .card .t small { display: block; font-weight: 400; opacity: 0.75; }
  /* glass reading panel: only for long answers */
  .glass { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%) translateY(16px); width: min(48rem, calc(100vw - 32px)); max-height: 52vh; overflow: auto;
    padding: 1.3rem 1.5rem; border-radius: 20px; background: rgba(255,247,233,0.22); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 20px 50px rgba(80,50,20,0.3); color: #2e2012; font-size: 1.05rem; line-height: 1.65;
    opacity: 0; transition: opacity .7s, transform .7s cubic-bezier(.2,.9,.2,1); }
  .glass.up { opacity: 1; transform: translateX(-50%); }
  .glass p { margin: 0 0 0.7em; }
  .hint { position: fixed; right: 14px; bottom: 10px; z-index: 6; font-size: 0.72rem; color: var(--ink-soft); }
  .hint b { font-weight: 600; }
  .tools { position: fixed; left: 14px; bottom: 10px; z-index: 6; display: flex; gap: 0.4rem; }
  .tools button { font: inherit; font-size: 0.72rem; padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,248,236,0.18); color: #4a3420; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 640px) { .bar input { font-size: 16px; } }
</style>
</head>
<body>
<canvas id="sand" aria-hidden="true"></canvas>
<form class="bar" id="bar" autocomplete="off"><input id="q" maxlength="400" placeholder="how can I help you?" aria-label="Ask VQ"></form>
<div class="glass" id="glass" role="region" aria-live="polite"></div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="tools"><button type="button" id="demo">Demo run</button><button type="button" id="night">Night</button><button type="button" id="reset">Clear</button></div>
<div class="hint" id="hint">sand prototype · <b id="mode">live</b></div>
<script>
'use strict';
// ---------------------------------------------------------------------------------------------
// VQ sand prototype. The sand is a live WebGL surface; anything VQ shows is pressed into it or
// raised out of it through a height mask drawn on a small canvas. Real backend events drive it.
// ---------------------------------------------------------------------------------------------
const API = 'https://veritas-quaesitor-production.up.railway.app/chat';
const cv = document.getElementById('sand');
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- height mask: items rise (+) or press in (-) ----------
const MS = 0.8;                                   // mask resolution relative to CSS pixels
const mask = document.createElement('canvas'), mx = mask.getContext('2d');
let items = [];                                   // {kind:'text'|'slab', x,y,w,h, text, size, depth:+/-, h:0..1, target, chars, font}
let maskDirty = true;
function add(it) { it.h = it.h || 0; it.target = it.target ?? 1; it.born = performance.now(); items.push(it); maskDirty = true; return it; }
function sink(it, ms) { if (!it) return; it.target = 0; it.sinkRate = ms || 700; maskDirty = true; }
function drawMask() {
  const W = mask.width, H = mask.height;
  mx.setTransform(1, 0, 0, 1, 0, 0); mx.filter = 'none';
  mx.fillStyle = 'rgb(128,128,128)'; mx.fillRect(0, 0, W, H);
  mx.setTransform(MS, 0, 0, MS, 0, 0);
  for (const it of items) {
    if (it.h <= 0.002) continue;
    const v = Math.round(128 + it.depth * 110 * it.h);
    mx.fillStyle = `rgb(${v},${v},${v})`;
    if (it.kind === 'slab') {
      mx.filter = `blur(${Math.max(1, 5 * (1 - it.h) + 1.2)}px)`;
      roundRect(mx, it.x, it.y, it.w, it.h2, 12); mx.fill();
    } else {
      mx.filter = `blur(${(0.35 + 3 * (1 - it.h)).toFixed(2)}px)`;
      mx.font = it.font || `500 ${it.size}px "Segoe UI", system-ui, sans-serif`;
      mx.textAlign = it.align || 'center'; mx.textBaseline = 'middle';
      const s = it.chars != null ? it.text.slice(0, Math.floor(it.chars)) : it.text;
      wrapText(s, it.x, it.y, it.maxW || 900, it.size * 1.25);
    }
  }
  mx.filter = 'none';
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrapText(s, x, y, maxW, lh) {
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (mx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line);
  lines.forEach((l, i) => mx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
}

// ---------- WebGL sand ----------
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uMask; uniform vec2 uRes; uniform float uT, uWork, uNight, uPulse, uFlow;
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*n2(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(1.7,9.2); a*=.5; } return s; }
// height of the sand at pixel position px (CSS px)
float H(vec2 px){
  vec2 p = px/uRes.y;
  // while VQ works the sand itself flows: a slow swirl around the centre that winds tighter as the work goes on
  vec2 c = vec2(0.5*uRes.x/uRes.y, 0.46); vec2 r = p-c; float d = length(r);
  float ang = uFlow*0.55*exp(-d*2.2); float cs = cos(ang), sn = sin(ang);
  p = c + mat2(cs,-sn,sn,cs)*r;
  float dunes = fbm(p*1.6)*0.9;
  vec2 w = vec2(fbm(p*3.+3.), fbm(p*3.+7.));
  float rip = sin((p.x*0.55 + p.y)*58. + w.x*7. + w.y*4. - uFlow*2.4)*0.5+0.5;
  rip = pow(rip, 1.6)*0.11*(0.6+0.8*fbm(p*4.));
  // work: rings that travel inward to where the answer will form, plus a slow swirl
  float work = uWork * 0.05 * smoothstep(0.6, 0.0, d);          // the centre gently heaps up, where the answer will form
  float pulse = uPulse * 0.04 * sin(d*12. - uT*2.5) * smoothstep(0.8,0.,d);   // one soft, wide swell, not fine rings
  float grain = (h21(floor(px*0.9)) - 0.5)*0.025;
  float m = (texture(uMask, vec2(px.x/uRes.x, px.y/uRes.y)).r - 0.5)*0.9;
  return dunes + rip + work + pulse + grain + m;
}
void main(){
  vec2 px = vec2(uv.x*uRes.x, (1.-uv.y)*uRes.y);
  float h = H(px), hx = H(px+vec2(1.5,0.)), hy = H(px+vec2(0.,1.5));
  vec3 n = normalize(vec3((h-hx)*48., (h-hy)*48., 1.));
  vec3 L = normalize(mix(vec3(-0.55,-0.6,0.62), vec3(0.5,-0.45,0.55), uNight));
  float diff = clamp(dot(n,L),0.,1.);
  float rim = pow(1.-n.z, 2.)*0.35;
  vec3 day = mix(vec3(0.63,0.45,0.28), vec3(0.98,0.84,0.64), diff);
  vec3 night = mix(vec3(0.07,0.09,0.14), vec3(0.55,0.63,0.78), diff);
  vec3 col = mix(day, night, uNight);
  col += rim*mix(vec3(1.,.8,.55), vec3(.6,.7,1.), uNight)*0.4;
  // grains: speckles of darker and brighter sand, a few catching the light
  float g = h21(floor(px*0.75)+3.1);
  col *= 0.9 + 0.2*g;
  float spark = step(0.9968, h21(floor(px*0.5)))*diff;
  col += spark*mix(vec3(1.,.93,.75), vec3(.8,.9,1.), uNight)*0.7;
  // drifting grains while VQ works: specks streaming toward the centre
  // soft vignette
  vec2 v = uv-0.5; col *= 1. - dot(v,v)*0.55;
  o = vec4(col,1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog, tex, U = {};
function initGL() {
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  ['uMask', 'uRes', 'uT', 'uWork', 'uNight', 'uPulse', 'uFlow'].forEach(k => U[k] = gl.getUniformLocation(prog, k));
}
let W = 0, Hh = 0;
function resize() {
  const dpr = Math.min(1.25, devicePixelRatio || 1);
  W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  mask.width = Math.round(W * MS); mask.height = Math.round(Hh * MS); maskDirty = true; layout();
}

// ---------- animation state ----------
const S = { work: 0, workT: 0, night: 0, nightT: 0, pulse: 0, flow: 0 };
let t0 = performance.now(), last = t0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.work += (S.workT - S.work) * Math.min(1, dt * 2.2);
  S.night += (S.nightT - S.night) * Math.min(1, dt * 1.5);
  S.pulse *= Math.pow(0.25, dt);
  S.flow += dt * S.work * 0.6;
  for (const it of items) {
    const rate = it.target > it.h ? (it.riseRate || 900) : (it.sinkRate || 700);
    const step = dt * 1000 / rate;
    const nh = it.target > it.h ? Math.min(it.target, it.h + step) : Math.max(it.target, it.h - step);
    if (nh !== it.h) { it.h = nh; maskDirty = true; }
    if (it.chars != null && it.chars < it.text.length) { it.chars = Math.min(it.text.length, it.chars + dt * (it.cps || 38)); maskDirty = true; }
  }
  items = items.filter(it => !(it.target === 0 && it.h <= 0));
  if (maskDirty) { drawMask(); gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mask); maskDirty = false; }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform1i(U.uMask, 0); gl.uniform2f(U.uRes, W, Hh); gl.uniform1f(U.uT, reduce ? 0 : (now - t0) / 1000);
  gl.uniform1f(U.uWork, reduce ? 0 : S.work); gl.uniform1f(U.uNight, S.night); gl.uniform1f(U.uPulse, reduce ? 0 : S.pulse); gl.uniform1f(U.uFlow, reduce ? 0 : S.flow);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

// ---------- layout of the scene ----------
const L = {};
function layout() {
  L.cx = W / 2; L.qY = Math.round(Hh * 0.25); L.stepY = Math.round(Hh * 0.36);
  L.cardTop = Math.round(Hh * 0.34); L.cardMaxH = Math.round(Hh * 0.34);
}

// ---------- the exchange ----------
let cur = null;   // { q, stepItems, cards, ansItem }
const live = document.getElementById('live'), glass = document.getElementById('glass'), bar = document.getElementById('bar'), qIn = document.getElementById('q');
function clearScene(fast) {
  items.forEach(it => sink(it, fast ? 350 : 800));
  document.querySelectorAll('.card').forEach(c => { c.classList.remove('up'); setTimeout(() => c.remove(), 900); });
  glass.classList.remove('up'); setTimeout(() => { if (!glass.classList.contains('up')) glass.innerHTML = ''; }, 700);
  S.workT = 0;
}
function begin(q) {
  clearScene(true);
  cur = { q, steps: [], cards: [], text: '', ans: null };
  // the question presses into the sand under the glass bar
  setTimeout(() => { cur.qItem = add({ kind: 'text', text: q, x: L.cx, y: L.qY, size: Math.min(44, W / 22), depth: -0.8, maxW: Math.min(W - 60, 1000), riseRate: 700 }); }, 120);
  S.workT = 0.35; S.pulse = 1;
  live.textContent = 'VQ is working on: ' + q;
}
function stepLine(label) {
  if (!cur) return;
  cur.steps.forEach((s, i) => { s.target = 0.35; s.y = L.stepY - (cur.steps.length - i) * 20; maskDirty = true; });
  while (cur.steps.length > 3) sink(cur.steps.shift(), 500);
  cur.steps.push(add({ kind: 'text', text: label.toLowerCase(), x: L.cx, y: L.stepY, size: 17, depth: -1, font: '500 17px ui-monospace, Menlo, Consolas, monospace', riseRate: 400 }));
  S.workT = 1; S.pulse = Math.max(S.pulse, 0.6);
}
function sourceFrag(domain) {
  if (!cur || !domain) return;
  const a = Math.random() * Math.PI * 2, r = Math.min(W, Hh) * (0.28 + Math.random() * 0.12);
  const it = add({ kind: 'text', text: domain, x: L.cx + Math.cos(a) * r * 1.4, y: Hh * 0.55 + Math.sin(a) * r * 0.55, size: 14, depth: 1, font: '500 14px ui-monospace, Menlo, monospace', riseRate: 500 });
  setTimeout(() => sink(it, 1400), 1600);
}
function cardsFrom(meta) {
  const out = [];
  (meta.movies || []).forEach(m => out.push({ img: m.poster, t: m.title, s: [m.year, m.rating ? '★ ' + m.rating : ''].filter(Boolean).join(' · '), url: m.url }));
  (meta.news || []).forEach(n => out.push({ img: n.image, t: n.title, s: n.source, url: n.url }));
  (meta.videos || []).forEach(v => out.push({ img: v.thumbnail || `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`, t: v.title, s: v.channel, url: `https://www.youtube.com/watch?v=${v.id}` }));
  (meta.books || []).forEach(b => out.push({ img: b.thumbnail || b.image, t: b.title, s: (b.authors || []).join(', '), url: b.url || b.link }));
  (meta.papers || []).forEach(p => out.push({ img: '', t: p.title, s: p.venue || p.year, url: p.url }));
  return out.slice(0, 6);
}
function raiseCards(list) {
  if (!cur || !list.length || cur.raised) return;
  cur.raised = true;
  if (cur.qItem) { cur.qItem.y = Hh * 0.2; cur.qItem.size = Math.min(30, W / 30); maskDirty = true; }
  const n = list.length, gap = 18, maxW = Math.min(W - 40, 1150);
  let cw = Math.min(170, (maxW - gap * (n - 1)) / n), ch = Math.round(cw * 1.5) + 50;
  if (ch > L.cardMaxH) { ch = L.cardMaxH; cw = Math.round((ch - 50) / 1.5); }
  cur.cardBottom = L.cardTop + ch; if (cur.glass) placeGlass();
  const total = n * cw + (n - 1) * gap, x0 = L.cx - total / 2, y = L.cardTop;
  list.forEach((c, i) => {
    const x = x0 + i * (cw + gap);
    setTimeout(() => {
      const slab = add({ kind: 'slab', x, y, w: cw, h2: ch, depth: 1, riseRate: 650 });
      cur.cards.push(slab);
      const el = document.createElement('a'); el.className = 'card'; el.href = c.url || '#'; el.target = '_blank'; el.rel = 'noopener noreferrer';
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' });
      if (c.img) { const im = new Image(); im.src = c.img; im.alt = ''; im.referrerPolicy = 'no-referrer'; el.appendChild(im); }
      const t = document.createElement('div'); t.className = 't'; t.textContent = c.t || ''; if (c.s) { const s = document.createElement('small'); s.textContent = c.s; t.appendChild(s); } el.appendChild(t);
      document.body.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('up')));
    }, i * 140);
  });
}
function answerText(full, done) {
  if (!cur) return;
  cur.text = full;
  const short = full.length <= 150 && !/\n/.test(full.trim());
  if (done && short && !cur.cards.length && !cur.glass) {
    // a short reply is written into the sand itself
    cur.ans = add({ kind: 'text', text: full.trim(), x: L.cx, y: Hh * 0.55, size: Math.min(34, W / 28), depth: -1, chars: 0, cps: 45, maxW: Math.min(W - 60, 1000), riseRate: 500 });
    return;
  }
  if (!short || cur.cards.length || cur.glass) {
    // longer replies get the glass panel, so they stay easy to read
    if (!cur.glass) { cur.glass = true; placeGlass(); glass.classList.add('up'); }
    glass.innerHTML = full.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>') + '</p>').join('');
  }
}
function placeGlass() {
  const top = cur && cur.cardBottom ? cur.cardBottom + 22 : Hh * 0.36;
  glass.style.top = top + 'px'; glass.style.maxHeight = Math.max(120, Hh - top - 48) + 'px';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function finish() {
  S.workT = 0; S.pulse = 0.5;
  if (cur) cur.steps.forEach(s => sink(s, 900));
  bar.classList.remove('sunk'); qIn.placeholder = 'anything else?'; qIn.focus({ preventScroll: true });
  live.textContent = cur ? cur.text : '';
}

// ---------- real backend (live events) ----------
async function ask(q) {
  begin(q); bar.classList.add('sunk');
  document.getElementById('mode').textContent = 'live';
  let full = '', meta = null, gotAny = false;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VQ-Device': deviceId() },
      body: JSON.stringify({ message: q, history: [], stream: true, clientCaps: [] }) });
    if (!res.ok || !res.body) throw new Error('http ' + res.status);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, cut).split('\n').find(l => l.startsWith('data:')); buf = buf.slice(cut + 2);
        if (!line) continue; let m; try { m = JSON.parse(line.slice(5)); } catch (e) { continue; }
        gotAny = true;
        if (m.ev) onEv(m.ev);
        if (m.meta) { meta = m.meta; const cl = cardsFrom(meta); if (cl.length) raiseCards(cl); }
        if (typeof m.delta === 'string') { full += m.delta; if (full.length > 150 || (cur && cur.cards.length)) answerText(full, false); }
        if (typeof m.replace === 'string') full = m.replace;
      }
    }
    if (meta) raiseCards(cardsFrom(meta));
    answerText(full || 'That one came back empty. Ask me again?', true);
  } catch (e) {
    if (!gotAny) { document.getElementById('mode').textContent = 'offline: demo'; return demoRun(q, true); }
    answerText(full || 'The signal dropped. Ask me again?', true);
  }
  finish();
}
function onEv(ev) {
  const d = ev.data || {};
  if (ev.type === 'search' || ev.type === 'tool') stepLine(d.label + (d.query && d.type !== 'tool' ? '' : ''));
  else if (ev.type === 'source') sourceFrag(d.domain || d.title);
  else if (ev.type === 'compose') stepLine('writing the answer');
  else if (ev.type === 'card') { /* cards rise together once their details have arrived */ }
}
function deviceId() { try { let id = localStorage.getItem('vq-device-id'); if (!id) { id = 'sand-' + Math.random().toString(36).slice(2); localStorage.setItem('vq-device-id', id); } return id; } catch (e) { return 'sand-proto'; } }

// ---------- demo (clearly labelled, for offline viewing) ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
async function demoRun(q, fromAsk) {
  q = q || 'show me some old top rated sci-fi films';
  if (!fromAsk) { begin(q); bar.classList.add('sunk'); }
  document.getElementById('mode').textContent = 'demo (scripted, not live)';
  await wait(700); stepLine('finding films');
  for (const d of ['themoviedb.org', 'imdb.com', 'bfi.org.uk', 'rottentomatoes.com']) { await wait(260); sourceFrag(d); }
  await wait(600); stepLine('choosing the best five');
  await wait(700);
  raiseCards([['2001: A Space Odyssey', '1968'], ['Blade Runner', '1982'], ['Back to the Future', '1985'], ['E.T.', '1982'], ['The Day the Earth Stood Still', '1951']].map(([t, s]) => ({ t, s, img: '' })));
  await wait(900); stepLine('writing the answer');
  const txt = 'Five classics that still hold up. 2001: A Space Odyssey is the one to start with: slow, vast and unlike anything since. Blade Runner asks what makes a person a person, and The Day the Earth Stood Still is a calm warning from 1951 that never dated.';
  for (let i = 0; i <= txt.length; i += 6) { answerText(txt.slice(0, i), false); await wait(30); }
  answerText(txt, true); finish();
}

// ---------- wiring ----------
bar.addEventListener('submit', e => { e.preventDefault(); const q = qIn.value.trim(); if (!q) return; qIn.value = ''; ask(q); });
document.getElementById('demo').onclick = () => demoRun();
document.getElementById('night').onclick = (e) => { S.nightT = S.nightT ? 0 : 1; e.target.textContent = S.nightT ? 'Day' : 'Night'; document.body.style.background = S.nightT ? '#121722' : '#c9a57a'; };
document.getElementById('reset').onclick = () => { clearScene(); cur = null; bar.classList.remove('sunk'); qIn.placeholder = 'how can I help you?'; };
addEventListener('resize', resize);
if (!gl) { document.body.innerHTML = '<p style="padding:2rem">This prototype needs WebGL2.</p>'; }
else { initGL(); resize(); requestAnimationFrame(frame); qIn.focus(); }
if (new URLSearchParams(location.search).has('demo')) setTimeout(() => demoRun(), 600);
</script>
