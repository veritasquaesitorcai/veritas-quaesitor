<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VQ Tessera</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#080d13;color:#dce6ed}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080d13}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
header{position:fixed;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 30px 14px;pointer-events:none;z-index:4}
.brand{font-size:12px;letter-spacing:.36em;font-weight:600;color:#dce6ed}
.subtitle{font-size:10px;color:#8294a5;letter-spacing:.12em;margin-top:9px}
.right{text-align:right;pointer-events:auto}
#status{font-size:11px;letter-spacing:.06em;color:#99adbc}
#status i{display:inline-block;background:#a8e1ef;width:5px;height:5px;border-radius:50%;margin-right:8px;box-shadow:0 0 12px #85d7ee;vertical-align:middle}
#account{margin-top:8px;font:10px inherit;letter-spacing:.08em;color:#7f97a8;background:none;border:0;padding:4px 0;cursor:pointer}
#account:hover{color:#cfe6f0}
#overlay{position:fixed;inset:0;z-index:2;pointer-events:none}
#overlay img{position:absolute;object-fit:cover;border-radius:6px;opacity:0;transition:opacity .9s ease;pointer-events:none}
#overlay img.on{opacity:.92}
#overlay .video{position:absolute;padding:0;border:0;background:#0b1620;border-radius:8px;overflow:hidden;opacity:0;transition:opacity .9s ease;pointer-events:auto;cursor:pointer}
#overlay .video.on{opacity:1}
#overlay .video img{position:static;width:100%;height:100%;opacity:.9;border-radius:0}
#overlay .video span{position:absolute;left:12px;bottom:10px;font:11px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.08em;color:#e6f4fb;background:#06111acc;border:1px solid #b9e2f233;border-radius:14px;padding:7px 11px}
#overlay .video:hover{outline:1px solid #a8dcef77;outline-offset:3px}
#overlay .video:hover img{opacity:1}
#player{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#03080dcc;backdrop-filter:blur(6px)}
#player[hidden]{display:none}
#player iframe{width:min(92vw,calc(80vh*16/9));aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#sources{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 66px);width:min(680px,calc(100% - 40px));z-index:3;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:10px;letter-spacing:.04em;opacity:0;transition:opacity .8s}
#sources.on{opacity:1}
#sources a{color:#7fa6ba;text-decoration:none}
#sources a:hover{color:#d6eef7;text-decoration:underline}
#editor{position:fixed;z-index:3;border:0;resize:none;background:transparent;color:#dfe9f2;padding:0;outline:0;line-height:1.6;font-family:inherit;visibility:hidden;caret-color:#a9deef;overflow:auto;scrollbar-width:none}
#editor::-webkit-scrollbar{display:none}
footer{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;width:min(680px,calc(100% - 40px));transform:translateX(-50%);z-index:5}
form{position:relative;display:flex;gap:10px;border:1px solid #b9d8ed33;background:#0e1924a6;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:30px;padding:6px 7px 6px 23px;box-shadow:0 8px 40px #0003,inset 0 1px #fff1}
input{width:100%;min-width:0;background:none;border:0;color:#e8f3fb;outline:none;font:14px inherit;position:relative;z-index:1}
#ghost{position:absolute;left:23px;right:60px;top:50%;transform:translateY(-50%);font-size:14px;color:#8ea4b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .45s}
#ghost.off{opacity:0}
#send{flex:none;border:1px solid #b8d6e22b;border-radius:50%;width:42px;height:42px;background:#bfd9e414;color:#d9edf7;font:22px system-ui;cursor:pointer}
#send:hover{background:#c5e4ee30}
#auth{position:fixed;top:70px;right:24px;z-index:6;width:min(300px,calc(100% - 48px));background:#0e1924ee;border:1px solid #b9d8ed33;border-radius:14px;padding:16px;font-size:12px;color:#b9cdd9;backdrop-filter:blur(14px)}
#auth[hidden]{display:none}
#auth button{margin-top:10px;margin-right:8px;font:12px inherit;color:#dcecf4;background:#bfd9e414;border:1px solid #b8d6e22b;border-radius:16px;padding:7px 12px;cursor:pointer}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#error{position:fixed;inset:20% 10%;z-index:10;color:#dfeafa;white-space:pre-wrap;font:16px/1.6 system-ui;display:none}
@media(max-width:600px){header{padding:18px 18px 10px}.brand{font-size:11px}.subtitle{font-size:9px;max-width:190px;line-height:1.5}footer{bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 24px)}form{padding-left:18px}#ghost{left:18px}input,#ghost{font-size:13px}#sources{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 62px)}}
</style>
</head>
<body>
<canvas id="surface" aria-hidden="true"></canvas>
<header>
  <div><div class="brand">VQ TESSERA</div><div class="subtitle">ONE SURFACE · IT BECOMES THE ANSWER</div></div>
  <div class="right"><div id="status"><i></i><span id="phase">VQ, ready</span></div><button id="account" type="button">Sign in</button></div>
</header>
<div id="overlay"></div>
<textarea id="editor" spellcheck="false" aria-label="Editable document"></textarea>
<nav id="sources" aria-label="Sources"></nav>
<footer>
  <form id="command" autocomplete="off">
    <input id="input" aria-label="Ask VQ" autocomplete="off">
    <span id="ghost" aria-hidden="true"></span>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
</footer>
<div id="auth" hidden><div id="auth-text">Sign in with Google to use your VQ account.</div><button id="auth-go" type="button">Continue with Google</button><button id="auth-out" type="button" hidden>Sign out</button></div>
<div id="player" hidden></div>
<div id="live" aria-live="polite"></div>
