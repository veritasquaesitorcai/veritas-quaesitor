<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VQ · Sand</title>
<style>
  :root { --ink: #3b2a18; --ink-soft: rgba(59,42,24,0.62); --glass: rgba(255,248,236,0.16); --glass-line: rgba(255,255,255,0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9a57a; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); }
  canvas#sand { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* glass input bar: rises out of the sand */
  /* input: no box. Your words sit in a shallow groove pressed into the sand */
  .bar { position: fixed; left: 50%; top: 9vh; width: min(46rem, calc(100vw - 32px)); transform: translateX(-50%); z-index: 5; transition: opacity .6s; }
  .bar.sunk { opacity: 0; pointer-events: none; }
  .bar input { width: 100%; padding: 1.05rem 1.3rem; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1.25rem; text-align: center; color: #2a1a0b; font-weight: 600;
    text-shadow: 0 1px 0 rgba(255,236,205,0.7), 0 -1px 0 rgba(90,60,30,0.25); caret-color: #3e2a16; }
  .bar input::placeholder { color: rgba(42,26,11,0.6); }
  /* cards that rise: real content (posters) laid over a raised sand slab */
  .card { position: fixed; z-index: 3; border-radius: 12px; overflow: hidden; cursor: pointer; color: var(--ink);
    transform: translateY(14px) scale(0.96); opacity: 0; filter: blur(4px) sepia(0.6);
    transition: transform .9s cubic-bezier(.2,.9,.2,1), opacity .9s, filter 1.1s; }
  .card.up { transform: none; opacity: 1; filter: none; }
  .card img { display: block; width: 100%; height: calc(100% - 3.1rem); object-fit: cover; mix-blend-mode: multiply; opacity: 0.92; }
  .card .t { position: absolute; left: 0; right: 0; bottom: 0; height: 3.1rem; padding: 0.4rem 0.6rem; font-size: 0.8rem; font-weight: 600; line-height: 1.2;
    color: #4a3420; text-shadow: 0 1px 0 rgba(255,240,215,0.6); overflow: hidden; }
  .card .t small { display: block; font-weight: 400; opacity: 0.75; }
  /* long answers: no panel. Words are pressed into the sand and surface one by one */
  .glass { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); width: min(46rem, calc(100vw - 40px)); overflow: auto; padding: 0.4rem 0.6rem 2rem;
    color: #2a1a0b; font-size: 1.12rem; line-height: 1.75; font-weight: 600; scrollbar-width: none;
    text-shadow: 0 1px 0 rgba(255,236,205,0.75), 0 -1px 0 rgba(95,62,28,0.32);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.2rem, #000 calc(100% - 2.4rem), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 1.2rem, #000 calc(100% - 2.4rem), transparent 100%);
    opacity: 0; transition: opacity .5s; }
  .glass::-webkit-scrollbar { display: none; }
  .glass.up { opacity: 1; }
  .glass p { margin: 0 0 0.8em; } .glass li { margin: 0 0 0.35em; list-style: none; } .glass ul { margin: 0 0 0.8em; padding: 0; }
  .glass li::before { content: "·"; margin-right: 0.55em; font-weight: 700; }
  .glass b { font-weight: 700; }
  .glass .w { display: inline-block; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; filter: blur(5px); transform: translateY(3px); color: #b48a58; text-shadow: none; } to { opacity: 1; filter: none; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .glass .w { animation: none; } }
  body.moon { --ink: #e0e6ef; --ink-soft: #c6d0df; }
  body.moon .bar input, body.moon .glass { color: #e0e6ef; text-shadow: 0 1px 1px #0b111e; caret-color: #e0e6ef; }
  body.moon .bar input::placeholder { color: #c6d0df; }
  body.moon .tools button, body.moon .card .t { color: #dce5ef; text-shadow: 0 1px 1px #111827; }
  .hint { position: fixed; right: 14px; bottom: 10px; z-index: 6; font-size: 0.72rem; color: var(--ink-soft); }
  .hint b { font-weight: 600; }
  .tools { position: fixed; left: 14px; bottom: 10px; z-index: 6; display: flex; gap: 0.4rem; }
  .tools button { font: inherit; font-size: 0.72rem; padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,248,236,0.18); color: #4a3420; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 640px) { .bar input { font-size: 16px; } }
</style>
</head>
<body>
<canvas id="sand" aria-hidden="true"></canvas>
<form class="bar" id="bar" autocomplete="off"><input id="q" maxlength="400" placeholder="how can I help you?" aria-label="Ask VQ"></form>
<div class="glass" id="glass" role="region" aria-live="polite"></div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="tools"><button type="button" id="demo">Demo run</button><button type="button" id="night">Night</button><button type="button" id="reset">Clear</button></div>
<div class="hint" id="hint">sand prototype · <b id="mode">live</b></div>
<script>
'use strict';
// ---------------------------------------------------------------------------------------------
// VQ sand prototype. The sand is a live WebGL surface; anything VQ shows is pressed into it or
// raised out of it through a height mask drawn on a small canvas. Real backend events drive it.
// ---------------------------------------------------------------------------------------------
const API = 'https://veritas-quaesitor-production.up.railway.app/chat';
const cv = document.getElementById('sand');
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- height mask: items rise (+) or press in (-) ----------
const MS = 1.25;                                   // mask resolution relative to CSS pixels
const mask = document.createElement('canvas'), mx = mask.getContext('2d');
let items = [];                                   // {kind:'text'|'slab', x,y,w,h, text, size, depth:+/-, h:0..1, target, chars, font}
let maskDirty = true;
function add(it) { it.h = it.h || 0; it.target = it.target ?? 1; it.born = performance.now(); items.push(it); maskDirty = true; return it; }
function sink(it, ms) { if (!it) return; it.target = 0; it.sinkRate = ms || 700; maskDirty = true; }
function drawMask() {
  const W = mask.width, H = mask.height;
  mx.setTransform(1, 0, 0, 1, 0, 0); mx.filter = 'none';
  mx.fillStyle = 'rgb(128,128,128)'; mx.fillRect(0, 0, W, H);
  mx.setTransform(MS, 0, 0, MS, 0, 0);
  for (const it of items) {
    if (it.h <= 0.002) continue;
    const v = Math.round(128 + it.depth * 110 * it.h);
    mx.fillStyle = `rgb(${v},${v},${v})`;
    if (it.kind === 'slab') {
      mx.filter = `blur(${Math.max(1, 5 * (1 - it.h) + 1.2)}px)`;
      roundRect(mx, it.x, it.y, it.w, it.h2, 12); mx.fill();
    } else {
      mx.filter = `blur(${(0.12 + 3 * (1 - it.h)).toFixed(2)}px)`;
      mx.font = it.font || `500 ${it.size}px "Segoe UI", system-ui, sans-serif`;
      mx.textAlign = it.align || 'center'; mx.textBaseline = 'middle';
      const s = it.chars != null ? it.text.slice(0, Math.floor(it.chars)) : it.text;
      wrapText(s, it.x, it.y, it.maxW || 900, it.size * 1.25);
    }
  }
  mx.filter = 'none';
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrapText(s, x, y, maxW, lh) {
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (mx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line);
  lines.forEach((l, i) => mx.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
}

// ---------- WebGL sand ----------
const VS = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
// Task 1 material: original generated sand photograph, embedded below (no network required).
// Licence: original AI-generated asset; no third-party material or attribution requirements.
// Prompt: overhead fine matte beige dune sand, irregular wind ripples, low sun upper left;
// no horizon, objects, footprints, text, brands, repeated tiling or sparkling grains.
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D uMask, uSand;
uniform vec2 uRes, uPhotoRes;
uniform float uT, uWork, uNight, uPulse, uFlow;
vec2 photoUV(vec2 px){
  // One photograph covers the viewport; never repeat it or stitch separate tiles.
  float scale = max(uRes.x/uPhotoRes.x, uRes.y/uPhotoRes.y);
  return (px-uRes*.5)/(uPhotoRes*scale)+.5;
}
float maskHeight(vec2 px){ return (texture(uMask,px/uRes).r-128./255.)*.9; }
float H(vec2 px){
  vec2 p=px/uRes.y;
  vec2 c=vec2(.5*uRes.x/uRes.y,.46), r=p-c;
  float d=length(r);
  // Existing work contract retained; the motion milestone follows separately.
  float wave=uWork*.012*sin(d*35.-uFlow*2.4)*exp(-d*3.);
  float pulse=uPulse*.025*sin(d*12.-uT*2.5)*(1.-smoothstep(0.,.8,d));
  return maskHeight(px)+wave+pulse;
}
void main(){
  vec2 px=vec2(uv.x*uRes.x,(1.-uv.y)*uRes.y);
  float h=H(px);
  float dx=(H(px+vec2(1.,0.))-H(px-vec2(1.,0.)))*.5;
  float dy=(H(px+vec2(0.,1.))-H(px-vec2(0.,1.)))*.5;
  vec3 n=normalize(vec3(-dx*13.,-dy*13.,1.));
  vec3 L=normalize(vec3(-.64,-.61,.46));
  // Relative illumination preserves the photographed grain shading; only mask/work relief
  // changes light. No pixel hashes, isolated highlights, or time-dependent idle grain noise.
  float diffuse=dot(n,L);
  float rel=clamp((.38+max(0.,diffuse)) / (.38+L.z),.40,1.45);
  vec2 drift=vec2(sin(uFlow*.5),cos(uFlow*.4)-1.)*uWork*3.;
  vec2 relief=vec2(dx,dy)*8.;
  vec3 photo=texture(uSand,photoUV(px+drift+relief)).rgb;
  float lum=dot(photo,vec3(.2126,.7152,.0722));
  vec3 day=photo;
  // Diffuse blue moonlight: preserve photographic detail without bronze daytime highlights.
  vec3 night=mix(vec3(lum),photo,.10)*vec3(.32,.43,.64);
  vec3 col=mix(day,night,uNight)*rel;
  float mk=maskHeight(px);
  col*=1.-smoothstep(.005,.27,-mk)*.69;
  col*=1.+smoothstep(.01,.3,mk)*.05;
  o=vec4(col,1.);
}`;

    const i = n++; const ww = w.replace(/\u0001/g, '<b>').replace(/\u0002/g, '</b>');
    return i >= settled ? `<span class="w" style="animation-delay:${Math.min(600, (i - settled) * 28)}ms">${ww}</span>` : ww;
  }).join('');
  const html = text.split(/\n{2,}/).map(par => {
    const lines = par.split('\n');
    if (lines.every(l => /^\s*(?:[*\-•]|\d+\.)\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + words(l.replace(/^\s*(?:[*\-•]|\d+\.)\s+/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + lines.map(words).join('<br>') + '</p>';
  }).join('');
  return { html, count: n };
}
function answerText(full, done) {
  if (!cur) return;
  full = cleanAnswer(full);
  cur.text = full;
  const short = full.length <= 150 && !/\n/.test(full.trim());
  if (done && short && !cur.cards.length && !cur.glass) {
    // a short reply is written into the sand itself
    cur.ans = add({ kind: 'text', text: full.trim(), x: L.cx, y: Hh * 0.55, size: Math.min(34, W / 28), depth: -1, chars: 0, cps: 45, maxW: Math.min(W - 60, 1000), riseRate: 500 });
    return;
  }
  if (!short || cur.cards.length || cur.glass) {
    // longer replies get the glass panel, so they stay easy to read
    if (!cur.glass) { cur.glass = true; cur.settled = 0; placeGlass(); glass.classList.add('up'); }
    const r = toHtml(full, cur.settled || 0); glass.innerHTML = r.html; cur.settled = r.count;
  }
}
function placeGlass() {
  const top = cur && cur.cardBottom ? cur.cardBottom + 26 : Hh * 0.33;
  glass.style.top = top + 'px'; glass.style.maxHeight = Math.max(120, Hh - top - 48) + 'px';
}
function sinkBar() { bar.classList.add('sunk'); if (groove) { groove.target = 0; maskDirty = true; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function finish() {
  S.workT = 0; S.pulse = 0.5;
  if (cur) cur.steps.forEach(s => sink(s, 900));
  bar.classList.remove('sunk'); if (groove) groove.target = 1; qIn.placeholder = 'anything else?'; qIn.focus({ preventScroll: true });
  live.textContent = cur ? cur.text : '';
}

// ---------- real backend (live events) ----------
async function ask(q) {
  begin(q); sinkBar();
  document.getElementById('mode').textContent = 'live';
  let full = '', meta = null, gotAny = false;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-VQ-Device': deviceId() },
      body: JSON.stringify({ message: q, history: [], stream: true, clientCaps: [] }) });
    if (!res.ok || !res.body) throw new Error('http ' + res.status);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, cut).split('\n').find(l => l.startsWith('data:')); buf = buf.slice(cut + 2);
        if (!line) continue; let m; try { m = JSON.parse(line.slice(5)); } catch (e) { continue; }
        gotAny = true;
        if (m.ev) onEv(m.ev);
        if (m.meta) { meta = m.meta; const cl = cardsFrom(meta); if (cl.length) raiseCards(cl); }
        if (typeof m.delta === 'string') { full += m.delta; if (full.length > 150 || (cur && cur.cards.length)) answerText(full, false); }
        if (typeof m.replace === 'string') full = m.replace;
      }
    }
    if (meta) raiseCards(cardsFrom(meta));
    answerText(full || 'That one came back empty. Ask me again?', true);
  } catch (e) {
    if (!gotAny) { document.getElementById('mode').textContent = 'offline: demo'; return demoRun(q, true); }
    answerText(full || 'The signal dropped. Ask me again?', true);
  }
  finish();
}
function onEv(ev) {
  const d = ev.data || {};
  if (ev.type === 'search' || ev.type === 'tool') stepLine(d.label + (d.query && d.type !== 'tool' ? '' : ''));
  else if (ev.type === 'source') sourceFrag(d.domain || d.title);
  else if (ev.type === 'compose') stepLine('writing the answer');
  else if (ev.type === 'card') { /* cards rise together once their details have arrived */ }
}
function deviceId() { try { let id = localStorage.getItem('vq-device-id'); if (!id) { id = 'sand-' + Math.random().toString(36).slice(2); localStorage.setItem('vq-device-id', id); } return id; } catch (e) { return 'sand-proto'; } }

// ---------- demo (clearly labelled, for offline viewing) ----------
const wait = ms => new Promise(r => setTimeout(r, ms));
async function demoRun(q, fromAsk) {
  q = q || 'show me some old top rated sci-fi films';
  if (!fromAsk) { begin(q); sinkBar(); }
  document.getElementById('mode').textContent = 'demo (scripted, not live)';
  await wait(700); stepLine('finding films');
  for (const d of ['themoviedb.org', 'imdb.com', 'bfi.org.uk', 'rottentomatoes.com']) { await wait(260); sourceFrag(d); }
  await wait(600); stepLine('choosing the best five');
  await wait(700);
  raiseCards([['2001: A Space Odyssey', '1968'], ['Blade Runner', '1982'], ['Back to the Future', '1985'], ['E.T.', '1982'], ['The Day the Earth Stood Still', '1951']].map(([t, s]) => ({ t, s, img: '' })));
  await wait(900); stepLine('writing the answer');
  const txt = 'Five classics that still hold up.\n\n* **2001: A Space Odyssey**: slow, vast and unlike anything since.\n* **Blade Runner** asks what makes a person a person.\n* **The Day the Earth Stood Still**: a calm warning from 1951.\n\n```vq-present\n{"type":"cards","items":[{"title":"x"}]}\n```\n\nStart with 2001 if you have an evening free.' || ' 2001: A Space Odyssey is the one to start with: slow, vast and unlike anything since. Blade Runner asks what makes a person a person, and The Day the Earth Stood Still is a calm warning from 1951 that never dated.';
  for (let i = 0; i <= txt.length; i += 6) { answerText(txt.slice(0, i), false); await wait(30); }
  answerText(txt, true); finish();
}

// ---------- wiring ----------
bar.addEventListener('submit', e => { e.preventDefault(); const q = qIn.value.trim(); if (!q) return; qIn.value = ''; ask(q); });
document.getElementById('demo').onclick = () => demoRun();
document.getElementById('night').onclick = (e) => { S.nightT = S.nightT ? 0 : 1; document.body.classList.toggle('moon', !!S.nightT); e.target.textContent = S.nightT ? 'Day' : 'Night'; document.body.style.background = S.nightT ? '#121722' : '#c9a57a'; };
document.getElementById('reset').onclick = () => { clearScene(); cur = null; bar.classList.remove('sunk'); qIn.placeholder = 'how can I help you?'; };
addEventListener('resize', resize);
if (!gl) { document.body.innerHTML = '<p style="padding:2rem">This prototype needs WebGL2.</p>'; }
else { initGL(); resize(); requestAnimationFrame(frame); qIn.focus(); }
if (new URLSearchParams(location.search).has('demo')) setTimeout(() => demoRun(), 600);
</script>
