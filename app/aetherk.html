#wb .wb-bar i::after{content:"";position:absolute;right:0;top:-1px;width:3px;height:3px;border-radius:50%;background:#e8fbff;box-shadow:0 0 6px #bff0ff}
/* written in light: a soft edge sweeps across, then the glow settles */
#wb .wb-item.new .wb-label,#wb .wb-item.new .wb-title{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:wbwrite 1.9s cubic-bezier(.3,0,.2,1) both}
#wb .wb-item.new .wb-title{animation-delay:.25s}
#wb .wb-item.new{animation:wbglow 2.6s ease both}
@keyframes wbwrite{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes wbglow{0%{text-shadow:0 0 0 #0000;opacity:0}20%{opacity:1}60%{opacity:1}100%{opacity:var(--o,.55)}}
#wb.focus .wb-now,#wb.focus .wb-head,#wb.focus .wb-pulse,#wb.focus .wb-item{transform:perspective(560px) rotateY(-5deg)}
#wb.focus .wb-item{opacity:min(1,calc(var(--o,.6) + .2));background:linear-gradient(270deg,rgba(150,215,245,.16),rgba(150,215,245,.09) 65%,rgba(150,215,245,.06));border-color:rgba(180,230,252,.2)}
#wb.focus .wb-title{color:#eef8fd}
#wb.away{opacity:0!important}
#wb .wb-item.leave{opacity:0!important;transform:perspective(620px) rotateY(-19deg) translateY(-6px)}
/* phones and narrow screens: one quiet line under the status */
@media (max-width:1099px){#wb-stage{perspective:none}#wb{transform:none;filter:none;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 62px);width:min(560px,calc(100% - 48px))}
 #wb .wb-head,#wb .wb-pulse,#wb .wb-now{display:none}#wb .wb-item{transform:none}#wb .wb-list{padding-left:16px}#wb .wb-list::before{display:none}#wb .wb-spark{display:none}
 #wb .wb-item{display:none;padding:2px 0;margin:0}#wb .wb-item:first-of-type{display:block}#wb .wb-item::before{left:-15px;top:7px;width:5px;height:5px}#wb .wb-item::after{display:none}
 #wb .wb-item{text-shadow:0 1px 6px #000,0 0 14px #000c}#wb .wb-label{display:inline;margin-right:10px;font-size:8px}#wb .wb-title{display:inline;font-size:11.5px;-webkit-line-clamp:1}#wb .wb-bar,#wb .wb-meta{display:none}}

#wb.world .wb-list{display:grid;grid-template-rows:repeat(6,var(--wb-panel-h,90px));gap:10px;min-height:0}
#wb.world .wb-item{height:var(--wb-panel-h,90px);min-height:0;max-height:var(--wb-panel-h,90px);margin:0!important;box-sizing:border-box;flex:none}
#wb.world .wb-item .wb-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#wb.world .wb-now{height:30px;min-height:30px;max-height:30px;overflow:hidden}
#wb.world .wb-subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:1}
#wb.world .wb-head{height:22px;min-height:22px;max-height:22px;overflow:hidden}
#wb.world .wb-pulse{height:13px;min-height:13px;max-height:13px}
#wb.world .wb-more{position:absolute;right:0;top:-12px;height:10px;line-height:10px;margin:0;font-size:8px}
#wb .wb-static{pointer-events:auto;cursor:pointer}
#wb .wb-static:focus-visible{outline:1px solid #bceaff;outline-offset:3px}
#wb .wb-item.empty{cursor:default;pointer-events:none}
@media(max-width:1099px){#wb .wb-static{display:none!important}}
/* Settled orbital glass: luminous edges, separated panels, no enclosing HUD frame. */
#wb.world .wb-item{background:linear-gradient(105deg,rgba(35,62,80,.30),rgba(84,132,162,.32) 72%,rgba(119,172,201,.38));border:1px solid rgba(165,214,240,.25);border-top-color:rgba(192,231,250,.34);border-right-color:rgba(202,236,252,.42);box-shadow:inset 0 0 15px rgba(130,194,229,.07),inset -1px 0 2px rgba(207,239,255,.20),0 0 9px rgba(115,185,226,.12),0 8px 23px rgba(0,8,18,.15);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-radius:7px;margin-bottom:13px;padding:11px 12px 12px 14px;}
#wb.world .wb-list::before{display:block;content:"";position:absolute;left:5px;top:-12px;bottom:5px;width:1px;background:linear-gradient(transparent,rgba(155,215,245,.28) 9%,rgba(135,198,233,.22) 85%,transparent);box-shadow:0 0 7px rgba(140,209,244,.22);pointer-events:none}
#wb.world .wb-title{text-shadow:0 0 3px rgba(172,226,250,.20);color:#e5f1f7}
#wb.world .wb-now,#wb.world .wb-head{opacity:.65}
#wb.world .wb-haze{background:radial-gradient(ellipse at 8% 20%,rgba(125,195,232,calc(.18*var(--fxhaze,1))),rgba(90,155,200,0) 65%),linear-gradient(105deg,rgba(112,170,212,calc(.12*var(--fxhaze,1))),rgba(112,170,212,0) 48%,rgba(165,220,243,calc(.20*var(--fxhaze,1))))}


/* Optional hardware housing; the default remains the original glass. */
#wb.solid-panel .wb-item,#wb-stage #wb.solid-panel .wb-item,body.wb-solid #wb-reader .wb-item{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);background-color:#101b25;opacity:1;border-color:#72899166;border-right-color:#b0c3c977;box-shadow:inset 0 1px 0 #c0d2d31c,inset -1px 0 0 #c4d4d32b,0 5px 13px #0005;backdrop-filter:none;-webkit-backdrop-filter:none}
#wb.solid-panel .wb-haze,#wb.solid-panel .wb-sheen{opacity:.65}
#wb.solid-panel .wb-title{text-shadow:0 1px 2px #0008}
body.wb-solid #wbx .x-card{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);border-color:#72899166;box-shadow:inset 0 1px 0 #c0d2d31c,0 5px 13px #0005}


#wb.world .wb-static,#wb-reader .wb-static{display:flex;align-items:center;justify-content:center}
#wb .wb-inscription,#wb-reader .wb-inscription{display:block;width:100%;font-family:'VQ Orbital',monospace;font-size:13px;font-weight:500;line-height:1.4;letter-spacing:.07em;text-align:center;color:#c6e5f2;text-shadow:0 0 9px #8cd5ef40;white-space:nowrap}

20when\x20you\x20return.\x20The\x20workbench\x20on\x20the\x20right\x20shows\x20his\x20work\x20in\x20light;\x20the\x20line\x20above\x20the\x20heartbeat\x20shows\x20what\x20he\x20is\x20doing\x20right\x20now.\x20Opening\x20a\x20find\x20tells\x20him\x20it\x20interests\x20you;\x20each\x20find\x20offers\x20follow-up\x20questions\x20and\x20Follow\x20this\x20closely\x20or\x20Ease\x20off\x20this\x20topic.\x20He\x20also\x20watches\x20your\x20sky\x20(space\x20station\x20passes\x20over\x20you,\x20launches,\x20the\x20full\x20Moon)\x20and\x20keeps\x20a\x20day\x20log\x20in\x20his\x20own\x20voice:\x20say\x20vq\x27s\x20day.\x20Everything\x20he\x20finishes\x20is\x20kept:\x20say\x20vq\x27s\x20work\x20to\x20see\x20it\x20all.\x20The\x20panel\x20stands\x20far\x20off\x20in\x20the\x20distance,\x20drawn\x20large\x20so\x20it\x20reads\x20at\x20the\x20same\x20size;\x20drifting\x20dust,\x20its\x20light\x20spill,\x20a\x20glass\x20sheen,\x20haze\x20on\x20its\x20far\x20edge\x20and\x20a\x20projection\x20beam\x20give\x20it\x20depth,\x20and\x20the\x20pointer\x20turns\x20into\x20a\x20small\x20distant\x20arrow\x20over\x20it.\x20The\x20bench\x20stays\x20in\x20the\x20world;\x20workbench\x20clear\x20opens\x20a\x20separate\x20reading\x20view,\x20and\x20workbench\x20depth\x20closes\x20it.\x20The\x20full\x20workbench\x20opens\x20VQ’s\x20whole\x20background\x20mind\x20full\x20screen:\x20his\x20heartbeat,\x20today’s\x20budget,\x20the\x20next\x20thought,\x20Clef’s\x20last\x20decisions,\x20your\x20interests\x20in\x20orbit,\x20today’s\x20events\x20and\x20every\x20piece\x20of\x20work\x20as\x20a\x20card;\x20the\x20bench\x20panels\x20fly\x20forward\x20into\x20it.\x20Say\x20workbench\x20full\x20to\x20open\x20it,\x20or\x20workbench\x20full\x20on\x20to\x20make\x20all\x20of\x20VQ’s\x20work\x20always\x20open\x20that\x20way.\x20VQ\x20also\x20hunts\x20for\x20genuinely\x20new\x20ideas\x20from\x20your\x20interests:\x20OPL\x203\x20proposes,\x20the\x20web\x20is\x20checked\x20for\x20prior\x20art\x20and\x20OPL\x204\x20judges\x20harshly,\x20so\x20only\x20an\x20idea\x20that\x20seems\x20truly\x20new\x20and\x20viable\x20reaches\x20the\x20Ideas\x20group\x20(never\x20news,\x20never\x20something\x20that\x20already\x20exists).\x20Opening\x20a\x20panel\x20files\x20it\x20into\x20history;\x20at\x20the\x20end\x20of\x20each\x20piece\x20you\x20rate\x20it\x20with\x20the\x20robot\x20thumbs\x20and\x20choose\x20Keep,\x20Watch,\x20Store\x20or\x20Discard\x20(and,\x20for\x20ideas,\x20Not\x20new\x20to\x20me).\x20A\x20quick\x20double-click\x20on\x20a\x20panel,\x20or\x20a\x20swipe\x20left\x20on\x20a\x20phone,\x20closes\x20it\x20and\x20eases\x20off\x20its\x20topic.\x20On\x20a\x20phone,\x20tap\x20the\x20bench\x20line\x20or\x20say\x20open\x20bench\x20for\x20the\x20full-screen\x20bench.\x20The\x20live\x20line\x20shows\x20which\x20operations\x20level\x20is\x20at\x20work:\x20OPL\x201\x20the\x20heartbeat\x20server,\x20OPL\x202\x20Clef,\x20OPL\x203\x20the\x20worker\x20model,\x20OPL\x204\x20the\x20deep\x20model,\x20OPL\x205\x20VQ\x20himself.\x20Add\x20your\x20own\x20topics\x20with\x20add\x20…\x20to\x20the\x20bench\x20(remove\x20…\x20from\x20the\x20bench\x20takes\x20one\x20off;\x20what\x20are\x20you\x20watching\x20lists\x20them);\x20topics\x20you\x20add\x20are\x20kept\x20for\x20good.\x20Double-click\x20a\x20panel\x20to\x20close\x20it;\x20when\x20more\x20work\x20is\x20waiting\x20than\x20fits,\x20a\x20line\x20under\x20the\x20panels\x20opens\x20all\x20of\x20it.\x20By\x20default\x20the\x20bench\x20travels\x20from\x20350,000\x20to\x20437,500\x20km\x20over\x20one\x20minute\x20and\x20returns\x20over\x20one\x20minute,\x20reaching\x2080%\x20apparent\x20size.\x20Workbench\x20turn\x2075%\x20changes\x20the\x20turnaround\x20size;\x20workbench\x20speed\x205\x20minutes\x20changes\x20the\x20duration\x20of\x20each\x20leg.\x20Workbench\x20motion\x20off\x20pauses\x20at\x20the\x20current\x20distance;\x20while\x20paused,\x20a\x20percentage\x20command\x20places\x20the\x20bench\x20at\x20that\x20chosen\x20distance.\x20Workbench\x20motion\x20on\x20resumes\x20there.\x20Speed\x20accepts\x20decimal\x20and\x20fractional\x20minutes\x20or\x20seconds,\x20such\x20as\x20workbench\x20speed\x200.5\x20minute,\x20workbench\x20speed\x201/2\x20minute\x20or\x20workbench\x20speed\x2030\x20seconds\x20(1\x20second\x20to\x2020\x20minutes\x20per\x20leg).\x20These\x20settings\x20are\x20remembered.\x20Its\x20physical\x20size\x20stays\x20fixed.\x20There\x20is\x20no\x20automatic\x20resizing.\x20The\x20former\x20distant\x20scene\x20placed\x20it\x20150\x20million\x20km\x20away,\x20as\x20far\x20as\x20the\x20Sun,\x20and\x20is\x20about\x2050\x20million\x20km\x20wide;\x20it\x20holds\x20still\x20like\x20a\x20star.\x20To\x20show\x20its\x20size,\x20objects\x20pass\x20in\x20front\x20of\x20it\x20at\x20their\x20true\x20distances:\x20a\x20space\x20station\x203\x20km\x20away,\x20a\x20satellite,\x20layers\x20of\x20debris,\x20a\x20starship,\x20a\x20small\x20moon,\x20an\x20asteroid\x20swarm,\x20a\x20ringed\x20rogue\x20planet,\x20a\x20comet,\x20a\x20solar\x20storm,\x20an\x20interstellar\x20visitor,\x20a\x20ship\x20dropping\x20out\x20of\x20warp\x20and\x20a\x20rare\x20wormhole;\x20a\x20light\x20pulse\x20takes\x208\x20min\x2020\x20s\x20to\x20reach\x20it.\x20The\x20planet\x20hides\x20whatever\x20is\x20behind\x20its\x20edge,\x20the\x20bench\x20included,\x20and\x20the\x20bench\x20dims\x20as\x20it\x20sinks\x20through\x20the\x20air\x20above\x20the\x20limb.\x20On\x20journeys\x20it\x20jumps\x20to\x20warp\x20ahead\x20of\x20you\x20and\x20drops\x20out\x20of\x20warp\x20when\x20you\x20arrive\x20(workbench\x20fly\x20fade\x20for\x20a\x20plain\x20fade).\x20Each\x20object\x20can\x20be\x20switched\x20off\x20or\x20scaled,\x20for\x20example\x20workbench\x20comet\x20off\x20or\x20workbench\x20space\x20off;\x20workbench\x20space\x20demo\x20shows\x20them\x20one\x20by\x20one.\x20Two\x20lights\x20from\x20just\x20outside\x20the\x20screen,\x20near\x20you,\x20reach\x20all\x20the\x20way\x20to\x20the\x20distant\x20bench\x20and\x20pool\x20on\x20it\x20(workbench\x20lights\x20on,\x20of
