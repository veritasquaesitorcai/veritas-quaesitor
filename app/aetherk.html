#wb .wb-bar i::after{content:"";position:absolute;right:0;top:-1px;width:3px;height:3px;border-radius:50%;background:#e8fbff;box-shadow:0 0 6px #bff0ff}
/* written in light: a soft edge sweeps across, then the glow settles */
#wb .wb-item.new .wb-label,#wb .wb-item.new .wb-title{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:wbwrite 1.9s cubic-bezier(.3,0,.2,1) both}
#wb .wb-item.new .wb-title{animation-delay:.25s}
#wb .wb-item.new{animation:wbglow 2.6s ease both}
@keyframes wbwrite{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes wbglow{0%{text-shadow:0 0 0 #0000;opacity:0}20%{opacity:1}60%{opacity:1}100%{opacity:var(--o,.55)}}
#wb.focus .wb-now,#wb.focus .wb-head,#wb.focus .wb-pulse,#wb.focus .wb-item{transform:perspective(560px) rotateY(-5deg)}
#wb.focus .wb-item{opacity:min(1,calc(var(--o,.6) + .2));background:linear-gradient(270deg,rgba(150,215,245,.16),rgba(150,215,245,.09) 65%,rgba(150,215,245,.06));border-color:rgba(180,230,252,.2)}
#wb.focus .wb-title{color:#eef8fd}
#wb.away{opacity:0!important}
#wb .wb-item.leave{opacity:0!important;transform:perspective(620px) rotateY(-19deg) translateY(-6px)}
/* phones and narrow screens: one quiet line under the status */
@media (max-width:1099px){#wb-stage{perspective:none}#wb{transform:none;filter:none;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 62px);width:min(560px,calc(100% - 48px))}
 #wb .wb-head,#wb .wb-pulse,#wb .wb-now{display:none}#wb .wb-item{transform:none}#wb .wb-list{padding-left:16px}#wb .wb-list::before{display:none}#wb .wb-spark{display:none}
 #wb .wb-item{display:none;padding:2px 0;margin:0}#wb .wb-item:first-of-type{display:block}#wb .wb-item::before{left:-15px;top:7px;width:5px;height:5px}#wb .wb-item::after{display:none}
 #wb .wb-item{text-shadow:0 1px 6px #000,0 0 14px #000c}#wb .wb-label{display:inline;margin-right:10px;font-size:8px}#wb .wb-title{display:inline;font-size:11.5px;-webkit-line-clamp:1}#wb .wb-bar,#wb .wb-meta{display:none}}

#wb.world .wb-list{display:grid;grid-template-rows:repeat(6,var(--wb-panel-h,90px));gap:10px;min-height:0}
#wb.world .wb-item{height:var(--wb-panel-h,90px);min-height:0;max-height:var(--wb-panel-h,90px);margin:0!important;box-sizing:border-box;flex:none}
#wb.world .wb-item .wb-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#wb.world .wb-now{height:30px;min-height:30px;max-height:30px;overflow:hidden}
#wb.world .wb-subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:1}
#wb.world .wb-head{height:22px;min-height:22px;max-height:22px;overflow:hidden}
#wb.world .wb-pulse{height:13px;min-height:13px;max-height:13px}
#wb.world .wb-more{position:absolute;right:0;top:-12px;height:10px;line-height:10px;margin:0;font-size:8px}
#wb .wb-static{pointer-events:auto;cursor:pointer}
#wb .wb-static:focus-visible{outline:1px solid #bceaff;outline-offset:3px}
#wb .wb-item.empty{cursor:default;pointer-events:none}
@media(max-width:1099px){#wb .wb-static{display:none!important}}
/* Settled orbital glass: luminous edges, separated panels, no enclosing HUD frame. */
#wb.world .wb-item{background:linear-gradient(105deg,rgba(35,62,80,.30),rgba(84,132,162,.32) 72%,rgba(119,172,201,.38));border:1px solid rgba(165,214,240,.25);border-top-color:rgba(192,231,250,.34);border-right-color:rgba(202,236,252,.42);box-shadow:inset 0 0 15px rgba(130,194,229,.07),inset -1px 0 2px rgba(207,239,255,.20),0 0 9px rgba(115,185,226,.12),0 8px 23px rgba(0,8,18,.15);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-radius:7px;margin-bottom:13px;padding:11px 12px 12px 14px;}
#wb.world .wb-list::before{display:block;content:"";position:absolute;left:5px;top:-12px;bottom:5px;width:1px;background:linear-gradient(transparent,rgba(155,215,245,.28) 9%,rgba(135,198,233,.22) 85%,transparent);box-shadow:0 0 7px rgba(140,209,244,.22);pointer-events:none}
#wb.world .wb-title{text-shadow:0 0 3px rgba(172,226,250,.20);color:#e5f1f7}
#wb.world .wb-now,#wb.world .wb-head{opacity:.65}
#wb.world .wb-haze{background:linear-gradient(105deg,rgba(112,170,212,.07),transparent 48%,rgba(136,198,229,.10))}


/* Optional hardware housing; the default remains the original glass. */
#wb.solid-panel .wb-item,#wb-stage #wb.solid-panel .wb-item,body.wb-solid #wb-reader .wb-item{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);background-color:#101b25;opacity:1;border-color:#72899166;border-right-color:#b0c3c977;box-shadow:inset 0 1px 0 #c0d2d31c,inset -1px 0 0 #c4d4d32b,0 5px 13px #0005;backdrop-filter:none;-webkit-backdrop-filter:none}
#wb.solid-panel .wb-haze,#wb.solid-panel .wb-sheen{opacity:.25}
#wb.solid-panel .wb-title{text-shadow:0 1px 2px #0008}
body.wb-solid #wbx .x-card{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);border-color:#72899166;box-shadow:inset 0 1px 0 #c0d2d31c,0 5px 13px #0005}


#wb.world .wb-static,#wb-reader .wb-static{display:flex;align-items:center;justify-content:center}
#wb .wb-inscription,#wb-reader .wb-inscription{display:block;width:100%;font-family:'VQ Orbital',monospace;font-size:13px;font-weight:500;line-height:1.4;letter-spacing:.07em;text-align:center;color:#c6e5f2;text-shadow:0 0 9px #8cd5ef40;white-space:nowrap}
