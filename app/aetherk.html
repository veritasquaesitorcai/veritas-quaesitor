#wb .wb-bar i::after{content:"";position:absolute;right:0;top:-1px;width:3px;height:3px;border-radius:50%;background:#e8fbff;box-shadow:0 0 6px #bff0ff}
/* written in light: a soft edge sweeps across, then the glow settles */
#wb .wb-item.new .wb-label,#wb .wb-item.new .wb-title{-webkit-mask-image:linear-gradient(90deg,#000 45%,#0000 55%);mask-image:linear-gradient(90deg,#000 45%,#0000 55%);-webkit-mask-size:240% 100%;mask-size:240% 100%;animation:wbwrite 1.9s cubic-bezier(.3,0,.2,1) both}
#wb .wb-item.new .wb-title{animation-delay:.25s}
#wb .wb-item.new{animation:wbglow 2.6s ease both}
@keyframes wbwrite{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes wbglow{0%{text-shadow:0 0 0 #0000;opacity:0}20%{opacity:1}60%{opacity:1}100%{opacity:var(--o,.55)}}
#wb.focus .wb-now,#wb.focus .wb-head,#wb.focus .wb-pulse,#wb.focus .wb-item{transform:perspective(560px) rotateY(-5deg)}
#wb.focus .wb-item{opacity:min(1,calc(var(--o,.6) + .2));background:linear-gradient(270deg,rgba(150,215,245,.16),rgba(150,215,245,.09) 65%,rgba(150,215,245,.06));border-color:rgba(180,230,252,.2)}
#wb.focus .wb-title{color:#eef8fd}
#wb.away{opacity:0!important}
#wb .wb-item.leave{opacity:0!important;transform:perspective(620px) rotateY(-19deg) translateY(-6px)}
/* phones and narrow screens: one quiet line under the status */
@media (max-width:1099px){#wb-stage{perspective:none}#wb{transform:none;filter:none;top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(max(22px,env(safe-area-inset-bottom)) + 62px);width:min(560px,calc(100% - 48px))}
 #wb .wb-head,#wb .wb-pulse,#wb .wb-now{display:none}#wb .wb-item{transform:none}#wb .wb-list{padding-left:16px}#wb .wb-list::before{display:none}#wb .wb-spark{display:none}
 #wb .wb-item{display:none;padding:2px 0;margin:0}#wb .wb-item:first-of-type{display:block}#wb .wb-item::before{left:-15px;top:7px;width:5px;height:5px}#wb .wb-item::after{display:none}
 #wb .wb-item{text-shadow:0 1px 6px #000,0 0 14px #000c}#wb .wb-label{display:inline;margin-right:10px;font-size:8px}#wb .wb-title{display:inline;font-size:11.5px;-webkit-line-clamp:1}#wb .wb-bar,#wb .wb-meta{display:none}}

#wb.world .wb-list{display:grid;grid-template-rows:repeat(6,var(--wb-panel-h,90px));gap:10px;min-height:0}
#wb.world .wb-item{height:var(--wb-panel-h,90px);min-height:0;max-height:var(--wb-panel-h,90px);margin:0!important;box-sizing:border-box;flex:none}
#wb.world .wb-item .wb-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#wb.world .wb-now{height:30px;min-height:30px;max-height:30px;overflow:hidden}
#wb.world .wb-subj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:1}
#wb.world .wb-head{height:22px;min-height:22px;max-height:22px;overflow:hidden}
#wb.world .wb-pulse{height:13px;min-height:13px;max-height:13px}
#wb.world .wb-more{position:absolute;right:0;top:-12px;height:10px;line-height:10px;margin:0;font-size:8px}
#wb .wb-static{pointer-events:auto;cursor:pointer}
#wb .wb-static:focus-visible{outline:1px solid #bceaff;outline-offset:3px}
#wb .wb-item.empty{cursor:default;pointer-events:none}
@media(max-width:1099px){#wb .wb-static{display:none!important}}
/* Settled orbital glass: luminous edges, separated panels, no enclosing HUD frame. */
#wb.world .wb-item{background:linear-gradient(105deg,rgba(35,62,80,.30),rgba(84,132,162,.32) 72%,rgba(119,172,201,.38));border:1px solid rgba(165,214,240,.25);border-top-color:rgba(192,231,250,.34);border-right-color:rgba(202,236,252,.42);box-shadow:inset 0 0 15px rgba(130,194,229,.07),inset -1px 0 2px rgba(207,239,255,.20),0 0 9px rgba(115,185,226,.12),0 8px 23px rgba(0,8,18,.15);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-radius:7px;margin-bottom:13px;padding:11px 12px 12px 14px;}
#wb.world .wb-list::before{display:block;content:"";position:absolute;left:5px;top:-12px;bottom:5px;width:1px;background:linear-gradient(transparent,rgba(155,215,245,.28) 9%,rgba(135,198,233,.22) 85%,transparent);box-shadow:0 0 7px rgba(140,209,244,.22);pointer-events:none}
#wb.world .wb-title{text-shadow:0 0 3px rgba(172,226,250,.20);color:#e5f1f7}
#wb.world .wb-now,#wb.world .wb-head{opacity:.65}
#wb.world .wb-haze{background:radial-gradient(ellipse at 8% 20%,rgba(125,195,232,calc(.18*var(--fxhaze,1))),rgba(90,155,200,0) 65%),linear-gradient(105deg,rgba(112,170,212,calc(.12*var(--fxhaze,1))),rgba(112,170,212,0) 48%,rgba(165,220,243,calc(.20*var(--fxhaze,1))))}


/* Optional hardware housing; the default remains the original glass. */
#wb.solid-panel .wb-item,#wb-stage #wb.solid-panel .wb-item,body.wb-solid #wb-reader .wb-item{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);background-color:#101b25;opacity:1;border-color:#72899166;border-right-color:#b0c3c977;box-shadow:inset 0 1px 0 #c0d2d31c,inset -1px 0 0 #c4d4d32b,0 5px 13px #0005;backdrop-filter:none;-webkit-backdrop-filter:none}
#wb.solid-panel .wb-haze,#wb.solid-panel .wb-sheen{opacity:.65}
#wb.solid-panel .wb-title{text-shadow:0 1px 2px #0008}
body.wb-solid #wbx .x-card{background:linear-gradient(110deg,#1b2933,#101b25 65%,#25353e);border-color:#72899166;box-shadow:inset 0 1px 0 #c0d2d31c,0 5px 13px #0005}


#wb.world .wb-static,#wb-reader .wb-static{display:flex;align-items:center;justify-content:center}
#wb .wb-inscription,#wb-reader .wb-inscription{display:block;width:100%;font-family:'VQ Orbital',monospace;font-size:13px;font-weight:500;line-height:1.4;letter-spacing:.07em;text-align:center;color:#c6e5f2;text-shadow:0 0 9px #8cd5ef40;white-space:nowrap}

#command-console{position:fixed;left:14px;top:18px;bottom:110px;width:280px;max-width:calc(100vw - 28px);z-index:90;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:14px;color:#c6e5f2;background:linear-gradient(135deg,#122835ed,#07121bf5 65%);border:1px solid #83cbeb55;border-radius:3px 16px 3px 16px;box-shadow:inset 0 0 28px #8cd5ef0c,0 0 26px #8cd5ef18,0 14px 40px #0009;backdrop-filter:blur(18px);font:12px monospace;isolation:isolate}#command-console[hidden]{display:none}#command-console header{position:static;inset:auto;padding:0;pointer-events:auto;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;letter-spacing:.15em;color:#a7d5e9;text-shadow:0 0 9px #8cd5ef55}#command-console button,#command-console input{font:inherit;color:inherit;box-sizing:border-box}#command-console button{border:0;background:transparent;cursor:pointer;text-align:left;padding:8px}#command-console button:hover{background:#9bd5ed16;box-shadow:inset 2px 0 #a7def1,0 0 14px #8cd5ef18}#command-console :focus-visible{outline:1px solid #b5e6fa;outline-offset:2px}#command-console input{min-width:0;width:100%;background:#030d16a6;border:1px solid #8cd5ef38;border-radius:3px;padding:8px;outline-offset:2px}#command-console .cc-search{flex-shrink:0;height:29px;border-radius:12px;background:linear-gradient(90deg,#9bd5ed0d,#030d1688)}#command-console .cc-status{font-size:10px;color:#87a8b9;line-height:1.4;min-height:27px}#command-console .cc-list{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#8cd5ef55 transparent;flex:1;min-height:0;padding-right:4px}#command-console .cc-switch{display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid #8cd5ef12;gap:8px}#command-console .cc-switch i{font-size:9px;font-style:normal;letter-spacing:.1em;padding:3px 5px;border:1px solid #8cd5ef33;color:#6e8a98}#command-console .cc-switch[aria-checked=true] i{color:#cbf0ff;background:#8cd5ef22;box-shadow:0 0 9px #8cd5ef20}#command-console .cc-row{content-visibility:auto;contain-intrinsic-size:auto 50px;display:flex;border-bottom:1px solid #8cd5ef12}#command-console .cc-row>button:first-child{flex:1;min-width:0;overflow-wrap:anywhere}#command-console small{display:block;font-size:9px;line-height:1.5;color:#7897a7;margin-top:4px}#command-console .cc-edit{align-self:center;color:#8cd5ef}#command-console .cc-parameter{display:block;width:100%;color:#9ec3d5}#command-console .cc-run{border-radius:3px;box-shadow:none;backdrop-filter:none;padding:10px 0 0;flex-shrink:0;display:flex;gap:5px;border-top:1px solid #8cd5ef33;padding-top:10px}#command-console .cc-run button{border:1px solid #8cd5ef44} @media(max-width:600px){#command-console{left:8px;top:10px;bottom:115px;width:252px;max-height:calc(100dvh - 125px);padding:12px}}


/* Above white: keep crisp glyph cores and increase their local luminous halo. */
#wb-stage #wb.text-boost :is(.wb-title,.wb-label,.wb-meta,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more),#wb-reader.text-boost :is(.wb-title,.wb-label,.wb-meta,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more){color:#fff;text-shadow:0 1px 2px #000,0 0 2px rgba(240,253,255,calc(.65*var(--wbboost))),0 0 7px rgba(190,235,255,calc(.65*var(--wbboost))),0 0 16px rgba(135,210,250,calc(.5*var(--wbboost)))}
#wb-reader{--wbboost:clamp(0,calc(var(--wbt,1) - 1),1)}


/* Reading changes legibility only; geometry, depth and effect preferences are retained. */
#wb-stage #wb.reading .wb-item,#wb-reader.reading .wb-item{opacity:1!important;background:rgba(4,12,20,.96)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#wb-stage #wb.reading :is(.wb-title,.wb-label,.wb-meta,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more),#wb-reader.reading :is(.wb-title,.wb-label,.wb-meta,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more){color:#fff!important;text-shadow:none!important;filter:none!important}
#wb-stage #wb.reading :is(.wb-title,.wb-label,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more),#wb-reader.reading :is(.wb-title,.wb-label,.wb-verb,.wb-subj,.wb-head b,.wb-head span,.wb-pulse,.wb-inscription,.wb-more){opacity:1!important}
#wb-stage #wb.reading .wb-title,#wb-reader.reading .wb-title{font-weight:600}


/* Material skin layers stay in the original projected workbench plane. */
:where(#wb,#wb-reader) .wb-material-skin{display:none;position:absolute!important;inset:0;width:100%!important;height:100%!important;border-radius:inherit;pointer-events:none;z-index:0;mix-blend-mode:normal}
:where(#wb,#wb-reader)[data-wb-material] .wb-material-skin{display:block}
:where(#wb,#wb-reader)[data-wb-material] .wb-item>span{position:relative;z-index:1}
:where(#wb,#wb-reader)[data-wb-material] .wb-item{overflow:hidden}

re\x20signed\x20in,\x20VQ\x20stays\x20awake.\x20He\x20learns\x20your\x20interests\x20from\x20your\x20questions,\x20watches\x20them\x20on\x20the\x20web,\x20re-checks\x20answers\x20you\x20kept,\x20finishes\x20tasks\x20he\x20promised\x20and\x20leaves\x20a\x20note\x20when\x20you\x20return.\x20The\x20workbench\x20on\x20the\x20right\x20shows\x20his\x20work\x20in\x20light;\x20the\x20line\x20above\x20the\x20heartbeat\x20shows\x20what\x20he\x20is\x20doing\x20right\x20now.\x20Opening\x20a\x20find\x20tells\x20him\x20it\x20interests\x20you;\x20each\x20find\x20offers\x20follow-up\x20questions\x20and\x20Follow\x20this\x20closely\x20or\x20Ease\x20off\x20this\x20topic.\x20He\x20also\x20watches\x20your\x20sky\x20(space\x20station\x20passes\x20over\x20you,\x20launches,\x20the\x20full\x20Moon)\x20and\x20keeps\x20a\x20day\x20log\x20in\x20his\x20own\x20voice:\x20say\x20vq\x27s\x20day.\x20Everything\x20he\x20finishes\x20is\x20kept:\x20say\x20vq\x27s\x20work\x20to\x20see\x20it\x20all.\x20The\x20panel\x20stands\x20far\x20off\x20in\x20the\x20distance,\x20drawn\x20large\x20so\x20it\x20reads\x20at\x20the\x20same\x20size;\x20drifting\x20dust,\x20its\x20light\x20spill,\x20a\x20glass\x20sheen,\x20haze\x20on\x20its\x20far\x20edge\x20and\x20a\x20projection\x20beam\x20give\x20it\x20depth,\x20and\x20the\x20pointer\x20turns\x20into\x20a\x20small\x20distant\x20arrow\x20over\x20it.\x20The\x20bench\x20stays\x20in\x20the\x20world;\x20workbench\x20clear\x20opens\x20a\x20separate\x20reading\x20view,\x20and\x20workbench\x20depth\x20closes\x20it.\x20The\x20full\x20workbench\x20opens\x20VQ’s\x20whole\x20background\x20mind\x20full\x20screen:\x20his\x20heartbeat,\x20today’s\x20budget,\x20the\x20next\x20thought,\x20Clef’s\x20last\x20decisions,\x20your\x20interests\x20in\x20orbit,\x20today’s\x20events\x20and\x20every\x20piece\x20of\x20work\x20as\x20a\x20card;\x20the\x20bench\x20panels\x20fly\x20forward\x20into\x20it.\x20Say\x20workbench\x20full\x20to\x20open\x20it,\x20or\x20workbench\x20full\x20on\x20to\x20make\x
