<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VQ Aqua</title>
<meta name="theme-color" content="#0b3a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2731; --ink-soft:#2c4b56; --glass:rgba(236,248,252,.74); --glass-edge:rgba(255,255,255,.55);
  --chip:rgba(236,248,252,.62); --accent:#0f7c8c; --accent-deep:#09505c; --shadow:0 18px 50px rgba(2,24,32,.28);
  --ui:"Inter",system-ui,sans-serif; --read:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b3a4a;color:var(--ink);font-family:var(--ui)}
#water{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);box-shadow:var(--shadow)}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none;z-index:5}
#top a,#top button{pointer-events:auto}
.pill{font:600 13px var(--ui);color:var(--ink);text-decoration:none;border-radius:999px;padding:9px 15px;cursor:pointer;border:1px solid var(--glass-edge);background:rgba(236,248,252,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill:hover{background:rgba(246,252,254,.8)}
#brand{font:560 15px var(--read);letter-spacing:.04em;color:rgba(232,248,252,.86);text-shadow:0 1px 8px rgba(0,30,40,.4);pointer-events:none}
/* status under the face */
#status{position:fixed;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 74px);transform:translateX(-50%);font:500 13px var(--ui);letter-spacing:.02em;color:rgba(232,248,252,.9);text-shadow:0 1px 10px rgba(0,30,40,.55);opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;z-index:3}
#status.on{opacity:1}
/* answer */
#stage{position:fixed;left:0;right:0;top:64px;bottom:108px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2vh 16px 0;overflow-y:auto;scrollbar-width:thin;z-index:2;pointer-events:none}
#stage>*{pointer-events:auto}
.answer{width:min(1500px,94vw);padding:2vh 1vw 2vh;font:500 clamp(21px,2.05vw,34px)/1.5 var(--read);color:var(--ink);transform-origin:50% 0}
body.ink-white .answer{--ink:#f2fbfd;--ink-soft:rgba(232,248,252,.85);--accent:#9fe6ee;--accent-deep:#d9f6f8;text-shadow:0 1px 2px rgba(0,25,35,.7),0 0 14px rgba(0,25,35,.55),0 0 34px rgba(0,25,35,.35)}
body.ink-black .answer{--ink:#06171d;--ink-soft:#173039;--accent:#064c57;--accent-deep:#032f37;text-shadow:0 0 2px rgba(235,250,252,.9),0 0 12px rgba(225,248,250,.75),0 0 30px rgba(225,248,250,.45)}
.answer.sinking{animation:sink .9s ease-in both}
.answer p{margin:0 0 .8em}.answer p:last-child{margin-bottom:0}
.answer h1,.answer h2,.answer h3{font:680 1.12em/1.3 var(--read);margin:.2em 0 .5em;color:var(--accent-deep)}
.answer ul,.answer ol{margin:0 0 .8em;padding-left:1.3em}.answer li{margin:.2em 0}
.answer a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.answer code{font:500 .86em ui-monospace,monospace;background:rgba(15,124,140,.1);padding:.1em .35em;border-radius:6px}
.answer strong{font-weight:680}
.w{display:inline;opacity:0;animation:word .9s ease-out forwards}
.w.in{opacity:1;filter:none;animation:none}
.sources{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px;animation:rise 1s 1s cubic-bezier(.2,.75,.2,1) both}
.sources a{font:500 12px var(--ui);color:var(--ink);text-shadow:none;text-decoration:none;background:rgba(236,248,252,.55);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 11px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;--ink:#0d2731}
.sources a:hover{background:rgba(246,252,254,.85)}
#diver{position:fixed;left:0;top:0;width:clamp(64px,7vw,104px);z-index:1;pointer-events:none;opacity:.78;filter:blur(.7px) saturate(.75) brightness(.92) drop-shadow(0 14px 10px rgba(0,30,40,.35));will-change:transform;transition:opacity 1s}
#diver svg{display:block;width:100%;overflow:visible}#diver .fins{transform-origin:10px 30px;animation:kick .7s ease-in-out infinite alternate}
#diver.off{opacity:0}
.bubble{position:fixed;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(225,250,252,.75);background:rgba(225,250,252,.15);pointer-events:none;z-index:1;animation:bub 1.8s ease-out forwards}
@keyframes kick{from{transform:rotate(-16deg) scaleX(.9)}to{transform:rotate(16deg) scaleX(1.1)}}
@keyframes bub{to{transform:translate(var(--dx),-70px) scale(1.6);opacity:0}}
#veil{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 50%,rgba(11,58,74,.2),#062a35 70%);opacity:0;pointer-events:none;transition:opacity .7s ease-in}
#veil.on{opacity:1}
/* settings */
#settings{position:fixed;top:60px;right:16px;width:min(320px,calc(100% - 32px));border-radius:20px;padding:16px 18px;z-index:8;font:400 14px/1.4 var(--ui)}
#settings[hidden]{display:none}
#settings h4{margin:0 0 10px;font:600 13px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
.seg{display:inline-flex;border-radius:999px;background:rgba(13,39,49,.08);padding:3px}
.seg button{border:0;background:transparent;font:600 12px var(--ui);color:var(--ink-soft);padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#topright{display:flex;gap:8px}
.present{width:min(900px,100%);margin:18px 0 6px;animation:rise 1.1s cubic-bezier(.2,.75,.2,1) both}
.present h3{font:680 15px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:rgba(232,248,252,.92);text-shadow:0 1px 8px rgba(0,30,40,.5);margin:0 0 12px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pcard{border-radius:20px;overflow:hidden;text-align:left;padding:0;cursor:pointer;font:inherit;color:var(--ink);animation:rise 1s cubic-bezier(.2,.75,.2,1) both}
.pcard img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.pcard .pc{padding:12px 14px 14px}.pcard b{display:block;font:680 16px/1.3 var(--read)}.pcard small{display:block;font:500 12px var(--ui);color:var(--accent);margin:2px 0 4px}
.pcard p{margin:0;font:400 14px/1.45 var(--ui);color:var(--ink-soft)}.pcard .more{display:none;margin-top:8px}.pcard.open .more{display:block}
.ptable{border-radius:20px;overflow:auto;padding:6px}.ptable table{width:100%;border-collapse:collapse;font:400 14px/1.4 var(--ui)}
.ptable th,.ptable td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(13,39,49,.1)}.ptable th{font-weight:600;color:var(--accent-deep)}
.plist{border-radius:20px;padding:10px 18px}.plist .it{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid rgba(13,39,49,.1);animation:rise .9s cubic-bezier(.2,.75,.2,1) both}
.plist .it:last-child{border-bottom:0}.plist .k{font:600 13px var(--ui);color:var(--accent);min-width:64px}.plist .v b{font:680 15px var(--read)}.plist .v p{margin:2px 0 0;font:400 14px/1.45 var(--ui);color:var(--ink-soft)}
.answer pre{white-space:pre-wrap;font:500 13px/1.5 ui-monospace,monospace;background:rgba(15,124,140,.08);padding:10px 12px;border-radius:12px}
.media{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:min(900px,100%);margin:18px 0 24px}
.card{position:relative;width:min(200px,42vw);border-radius:18px;overflow:hidden;cursor:pointer;padding:0;border:1px solid var(--glass-edge);background:rgba(236,248,252,.4);box-shadow:var(--shadow);animation:rise 1.1s cubic-bezier(.2,.75,.2,1) both}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.card span{display:block;font:500 12px/1.35 var(--ui);color:var(--ink);padding:8px 10px 10px;text-align:left;background:var(--glass)}
.card .play{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(9,80,92,.78);display:grid;place-items:center;padding:0}
.card .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
/* composer */
#composer{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 32px));display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 7px 7px 22px;z-index:6}
#ask{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 16px var(--ui);color:var(--ink);padding:10px 0}
#ask::placeholder{color:rgba(13,39,49,.5)}
#send{flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(160deg,#18a0b2,#0a6574);display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,101,116,.45);transition:transform .15s}
#send:hover{transform:scale(1.06)}#send:disabled{opacity:.45;cursor:default;transform:none}
#send svg{width:20px;height:20px}
#composer:focus-within{outline:2px solid rgba(24,160,178,.55);outline-offset:2px}
/* viewer */
#viewer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,30,40,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px}
#viewer[hidden]{display:none}
#viewer .frame{width:min(1100px,100%);max-height:86vh;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);animation:rise .8s cubic-bezier(.2,.75,.2,1) both;background:#021b24}
#viewer img{display:block;max-width:100%;max-height:86vh;margin:auto}
#viewer iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
#viewer .close{position:fixed;top:16px;right:16px}
#auth{position:fixed;top:60px;right:16px;width:min(300px,calc(100% - 32px));border-radius:20px;padding:18px;z-index:8;font:400 14px/1.5 var(--ui)}
#auth[hidden]{display:none}
#auth p{margin:0 0 12px}
#auth .row{display:flex;gap:8px;flex-wrap:wrap}
@keyframes surface{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes sink{to{opacity:0;transform:translateY(40px) scale(.96);filter:blur(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.9);filter:blur(8px) saturate(.4)}to{opacity:1;transform:none;filter:none}}
@keyframes word{to{opacity:1}}
@media (max-width:600px){.answer{padding:20px 20px 18px;font-size:17px;border-radius:22px}#stage{bottom:96px}#brand{display:none}}
@media (prefers-reduced-motion:reduce){.answer,.card,.w{animation-duration:.01s!important}}
</style>
</head>
